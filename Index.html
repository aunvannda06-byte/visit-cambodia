    add([
        ["The Royal Palace of Cambodia is a complex of buildings which serves as the official royal residence of the King of Cambodia.", "ព្រះបរមរាជវាំងកម្ពុជា គឺជាក្រុមអគារដែលជាព្រះរាជដំណាក់ផ្លូវការរបស់ព្រះមហាក្សត្រនៃព្រះរាជាណាចក្រកម្ពុជា។", "柬埔寨王宫是一组建筑群，是柬埔寨国王的正式王室官邸。"],
        ["Wat Phnom is a Buddhist temple in Doun Penh, Phnom Penh. The site features a pagoda, a stupa symbolizing the name of Phnom Penh, and a historical site that is part of the Khmer national identity. Wat Phnom has a total height of 46 meters.", "វត្តភ្នំជាវត្តព្រះពុទ្ធសាសនានៅខណ្ឌដូនពេញ រាជធានីភ្នំពេញ។ ទីតាំងនេះមានចេតិយ ស្តូប ដែលជានិមិត្តរូបនៃឈ្មោះភ្នំពេញ និងជាទីតាំងប្រវត្តិសាស្ត្រដែលជាផ្នែកមួយនៃអត្តសញ្ញាណជាតិខ្មែរ។ វត្តភ្នំមានកម្ពស់សរុប ៤៦ ម៉ែត្រ។", "金边塔是位于金边市Doun Penh区的一座佛教寺庙。这里有一座佛塔和一座象征“金边”之名的佛塔，是高棉民族身份的历史遗迹。金边塔总高46米。"],
        ["Koh Ker is a 10th-century temple complex in the north Cambodian jungle. A former capital of the Khmer Empire, the site is now remote and heavily forested. The main structure, Koh Ker Temple, is a stepped 7-tiered pyramid.", "កោះកេរ្តិ៍ជាក្រុមប្រាសាទសតវត្សទី ១០ នៅក្នុងព្រៃជ្រៅភាគខាងជើងនៃប្រទេសកម្ពុជា។ ធ្លាប់ជារាជធានីរបស់ចក្រភពខ្មែរ ឥឡូវនេះទីតាំងនេះស្ថិតនៅដាច់ស្រយាល និងមានព្រៃស្បាតក្រាស់។ សំណង់សំខាន់គឺប្រាសាទកោះកេរ្តិ៍ ជាពីរ៉ាមីតមានកម្រិតជាន់ ៧ ជាន់។", "贝列寺（Koh Ker）是柬埔寨北部丛林中的一座10世纪寺庙群。这里曾是高棉帝国的都城，如今地处偏远，森林茂密。主体建筑贝列寺是一座七层阶梯式金字塔。"],
        ["The Independence Monument in Phnom Penh, capital of Cambodia, was built in 1958 to memorialise Cambodia’s independence from France in 1953. It stands on a roundabout in the intersection of Norodom Boulevard and Sihanouk Boulevard in the centre of the city.", "វិមានឯករាជ្យនៅភ្នំពេញ រាជធានីនៃកម្ពុជា ត្រូវបានសាងសង់ឡើងក្នុងឆ្នាំ ១៩៥៨ ដើម្បីរំលឹកដល់ឯករាជ្យរបស់កម្ពុជាពីបារាំងក្នុងឆ្នាំ ១៩៥៣។ វាស្ថិតនៅលើកណ្តាលរង្វង់មូលត្រង់ចំណុចប្រសព្វនៃមហាវិថីព្រះនរោត្តម និងមហាវិថីព្រះសីហនុ នៅចំកណ្តាលទីក្រុង។", "金边的独立纪念碑建于1958年，用以纪念柬埔寨1953年脱离法国独立。它矗立在市中心诺罗敦大道与西哈努克大道交汇处的环岛上。"],
        ["The Tuol Sleng Genocide Museum is a museum for the Cambodian genocide. Located in Phnom Penh, the site is a former secondary school used as an internment facility known as Security Prison 21 by the Khmer Rouge regime from 1975 until its fall in 1979.", "សារមន្ទីរប្រល័យពូជសាសន៍ទួលស្លែង គឺជាសារមន្ទីរសម្រាប់ប្រល័យពូជសាសន៍នៅកម្ពុជា។ ស្ថិតនៅភ្នំពេញ ទីតាំងនេះជាអតីតវិទ្យាល័យ ដែលត្រូវបានរបបខ្មែរក្រហមប្រើជាកន្លែងឃុំឃាំង ហៅថាមន្ទីរសន្តិសុខ ២១ ចាប់ពីឆ្នាំ ១៩៧៥ រហូតដល់ការដួលរលំក្នុងឆ្នាំ ១៩៧៩។", "吐斯廉屠杀博物馆是纪念柬埔寨种族灭绝的博物馆。它位于金边，原为一所中学，1975年至1979年红色高棉政权垮台期间被用作拘留设施，称为“S-21安全监狱”。"],
        ["The National Museum of Cambodia is Cambodia’s largest museum of cultural history.", "សារមន្ទីរជាតិកម្ពុជា គឺជាសារមន្ទីរប្រវត្តិសាស្ត្រវប្បធម៌ធំបំផុតរបស់កម្ពុជា។", "柬埔寨国家博物馆是柬埔寨最大的文化历史博物馆。"],
        ["The Silver Pagoda is located on the south side of the Royal Palace in Chey Chumneas, Phnom Penh. The official name is Wat Ubaosoth Ratanaram, also known as Wat Preah Keo Morakot which is commonly shortened to Wat Preah Keo in Khmer.", "វត្តព្រះកែវមរកត ឬវត្តឧបោសថរតនារាម ស្ថិតនៅផ្នែកខាងត្បូងនៃព្រះបរមរាជវាំង ក្នុងខណ្ឌជ័យជំនះ ភ្នំពេញ។ ឈ្មោះផ្លូវការគឺវត្តឧបោសថរតនារាម ហៅម្យ៉ាងទៀតថាវត្តព្រះកែវមរកត ដែលតែងហៅខ្លីថាវត្តព្រះកែវ។", "银塔寺位于金边Chey Chumneas区王宫南侧。正式名称为 Wat Ubaosoth Ratanaram，又称翡翠佛寺（Wat Preah Keo Morakot），高棉语中常简称为 Wat Preah Keo。"],
        ["The Norodom Sihanouk Memorial, also called the Statue of King Father Norodom Sihanouk, is a monument commemorating former King Norodom Sihanouk located in Phnom Penh, Cambodia. The bronze statue is 4.5 meters tall and is housed under a 27 meter high stupa in the park east of the Independence Monument.The statue is dedicated to Sihanouk accomplishment on liberating the country on 9 November 1953 from the French colonialism.", "វិមានព្រះបរមរតនកោដ្ឋ នរោត្តម សីហនុ ហៅម្យ៉ាងទៀតថាព្រះបរមរូបព្រះបិតាឯករាជ្យជាតិ ជាវិមានរំលឹកដល់អតីតព្រះមហាក្សត្រ នរោត្តម សីហនុ ស្ថិតនៅភ្នំពេញ កម្ពុជា។ ព្រះរូបសំរិទ្ធមានកម្ពស់ ៤,៥ ម៉ែត្រ ហើយត្រូវបានតម្កល់ក្រោមស្តូបកម្ពស់ ២៧ ម៉ែត្រ នៅក្នុងសួនខាងកើតវិមានឯករាជ្យ។ ព្រះរូបនេះត្រូវបានឧទ្ទិសដល់ស្នាព្រះហស្តរបស់ព្រះបាទសីហនុក្នុងការរំដោះប្រទេសពីអាណានិគមបារាំងនៅថ្ងៃទី ៩ វិច្ឆិកា ១៩៥៣។", "诺罗敦·西哈努克纪念碑，又称西哈努克太皇雕像，是位于柬埔寨金边的一座纪念碑，用以纪念前国王诺罗敦·西哈努克。这尊青铜雕像高4.5米，安放在独立纪念碑以东公园内一座27米高的佛塔之下。雕像纪念西哈努克于1953年11月9日带领国家摆脱法国殖民统治的功绩。"],
        ["The Constitution Monument is destined to become one of Cambodia most sacred sites. This monument, a symbol of law and religion, aligns with the country motto: Nation, Religion, King.", "វិមានរដ្ឋធម្មនុញ្ញត្រូវបានតម្រូវឲ្យក្លាយជាទីសក្ការៈមួយក្នុងចំណោមទីសក្ការៈដ៏ពិសិដ្ឋបំផុតរបស់កម្ពុជា។ វិមាននេះជានិមិត្តរូបនៃច្បាប់ និងសាសនា ស្របតាមបាវចនារបស់ប្រទេស៖ ជាតិ សាសនា ព្រះមហាក្សត្រ។", "宪法纪念碑注定成为柬埔寨最神圣的场所之一。这座象征法律与宗教的纪念碑，契合国家格言：民族、宗教、国王。"],
        ["A lush oasis open to all in the middle of the city, with shaded walkways, restaurants, bars, a mini-golf, a pétanque court and even an open air theatre.", "ទីជម្រកដ៏បៃតងខៀវស្រងាត់ ដែលបើកចំហសម្រាប់មនុស្សគ្រប់គ្នាក្នុងចំកណ្តាលទីក្រុង មានផ្លូវដើរមានម្លប់ ភោជនីយដ្ឋាន បារ កន្លែងលេងហ្គោលតូច ទីលានលេងប៉េតង់ និងសូម្បីតែល្ខោនក្រៅផ្ទះ។", "市中心一片人人可享的绿洲，设有林荫步道、餐厅、酒吧、迷你高尔夫、法式滚球场，甚至还有露天剧场。"],
        ["A beautiful garden cafe for nature lovers.", "ហាងកាហ្វេសួនច្បារដ៏ស្រស់ស្អាតសម្រាប់អ្នកស្រឡាញ់ធម្មជាតិ។", "一家为热爱自然的人准备的美丽花园咖啡馆。"],
        ["Peaceful stay near the beach.", "កន្លែងស្នាក់នៅដ៏ស្ងប់ស្ងាត់ជិតឆ្នេរ។", "海滩附近宁静的住宿。"],
        ["PH Euro Park is the first entertainment, leisure and hospitality development of its kind, set over 3.11 hectares in the Grand Star Platinum. The inspiration for this development is as a unique destination experience, zoned into thematic areas inspired by Europe that are strung along a canal vista and boulevard crescent that transect the main axis of the development. The architectural themes of PH Euro Park feature Georgian, Victorian, Tuscan and Venetian influences, with iconic landmarks such as the Eiffel Tower, Big Ben, a French Renaissance bridge and many more. The axis of this development leads to the Convention Hall, which can be used as a grand conference area or ballroom.", "PH Euro Park គឺជាគម្រោងកម្សាន្ត ចំណាយពេលទំនេរ និងបដិសណ្ឋារកិច្ចដំបូងគេនៃប្រភេទនេះ ដែលសាងសង់លើទំហំ ៣,១១ ហិកតា ក្នុង Grand Star Platinum។ ការបំផុសគំនិតនៃគម្រោងនេះគឺដើម្បីបង្កើតបទពិសោធន៍គោលដៅពិសេស ដោយបែងចែកជាតំបន់តាមប្រធានបទដែលបានបំផុសគំនិតពីអឺរ៉ុប ដែលលាតសន្ធឹងតាមទិដ្ឋភាពប្រឡាយ និងមហាវិថីរាងកន្ត្រាក់ កាត់តាមអ័ក្សសំខាន់នៃគម្រោង។ ស្ថាបត្យកម្មរបស់ PH Euro Park មានឥទ្ធិពលបែបហ្សកហ្ស៊ី វិចតូរៀ តូស្កាន និងវេនីស ជាមួយនឹងសញ្ញាសម្គាល់ឆ្នើមដូចជាប៉មអេហ្វែល Big Ben ស្ពានបែបបារាំងសម័យរេនេសង់ និងអ្វីៗជាច្រើនទៀត។ អ័ក្សនៃគម្រោងនេះនាំទៅកាន់សាលសន្និសីទ ដែលអាចប្រើជាតំបន់ប្រជុំធំ ឬសាលរាំ។", "PH Euro Park 是同类中首个集娱乐、休闲和酒店于一体的开发项目，占地3.11公顷，位于 Grand Star Platinum 内。该项目的灵感来自独特的目的地体验，划分为以欧洲为灵感的主题区域，沿运河景观和弧形大道排列，贯穿开发区的主轴。PH Euro Park 的建筑主题融合了乔治亚、维多利亚、托斯卡纳和威尼斯风格，并有埃菲尔铁塔、大本钟、法国文艺复兴式桥梁等标志性地标。开发区的轴线通往会议厅，可用作大型会议区或宴会厅。"],
        ["Embark on a bi-millennium historical journey at the SOSORO Museum ! Discover 2,000 years of Cambodia fascinating history through a singular blend of interactive digital displays and old artifacts, in a state-of-the-art museum scenography. Through a large number of digital exhibits as well as ancient artifacts, visitors can learn at their own pace about Cambodia fascinating history, from the Funan era until nowadays.", "ចាប់ផ្តើមដំណើរប្រវត្តិសាស្ត្រពីរសហស្សវត្សរ៍នៅសារមន្ទីរ SOSORO! ស្វែងយល់ពីប្រវត្តិសាស្ត្រដ៏គួរឲ្យចាប់អារម្មណ៍ ២.០០០ ឆ្នាំរបស់កម្ពុជា តាមរយៈការលាយបញ្ចូលគ្នាតែមួយគត់នៃការតាំងបង្ហាញឌីជីថលអន្តរកម្ម និងវត្ថុបុរាណ ក្នុងទិដ្ឋភាពសារមន្ទីរទំនើបបំផុត។ តាមរយៈការតាំងបង្ហាញឌីជីថលជាច្រើន ព្រមទាំងវត្ថុបុរាណ អ្នកទស្សនាអាចរៀនសូត្រតាមល្បឿនផ្ទាល់ខ្លួនអំពីប្រវត្តិសាស្ត្រដ៏គួរឲ្យចាប់អារម្មណ៍របស់កម្ពុជា ចាប់ពីសម័យហ្វូណនរហូតដល់បច្ចុប្បន្ន។", "在 SOSORO 博物馆开启一场跨越两千年的历史之旅！通过互动数字展示与古老文物的独特结合，在最先进的博物馆展陈中探索柬埔寨2000年的迷人历史。借助大量数字展品和古代文物，参观者可以按自己的节奏了解柬埔寨从扶南时代至今的迷人历史。"],
        ["Hyatt Regency Phnom Penh is a five-star luxury hotel in Phnom Penh, conveniently located in the heart of the capital. Hotel guests enjoy a 5 - 10-minute walk distance to The Royal Palace of Cambodia, National Museum of Cambodia and the Tonle Sap riverside. With 247 modern rooms and suites, guests enjoy energizing décor, Bayon Temple-inspired headboards, walk-in rain showers, and tech-savvy amenities like high-speed Wi-Fi and Chromecast-enabled 65 TVs. A restored 1900 French Colonial villa adds heritage charm.", "សណ្ឋាគារ Hyatt Regency ភ្នំពេញ ជាសណ្ឋាគារប្រណីតប្រាំផ្កាយនៅភ្នំពេញ ស្ថិតនៅកន្លែងងាយស្រួលចំកណ្តាលរាជធានី។ ភ្ញៀវសណ្ឋាគារអាចដើរ ៥ - ១០ នាទីទៅកាន់ព្រះបរមរាជវាំងកម្ពុជា សារមន្ទីរជាតិកម្ពុជា និងមាត់ទន្លេសាប។ ជាមួយបន្ទប់ និងស៊ុយតទំនើប ២៤៧ ភ្ញៀវនឹងរីករាយជាមួយការតុបតែងដ៏រស់រវើក ក្បាលគ្រែបំផុសគំនិតពីប្រាសាទបាយ័ន ទឹកងូតបែបភ្លៀង និងសេវាកម្មបច្ចេកវិទ្យាទំនើបដូចជា Wi-Fi ល្បឿនលឿន និងទូរទស្សន៍ ៦៥ អ៊ីញ ដែលគាំទ្រ Chromecast។ វីឡាអាណានិគមបារាំងឆ្នាំ ១៩០០ ដែលបានជួសជុលឡើងវិញ បន្ថែមមន្តស្នេហ៍បេតិកភណ្ឌ។", "金边凯悦酒店是金边一家五星级豪华酒店，位于首都中心，交通便利。住客步行5至10分钟即可到达柬埔寨王宫、柬埔寨国家博物馆和洞里萨河畔。酒店拥有247间现代客房和套房，宾客可享受充满活力的装饰、以巴戎寺为灵感的床头板、步入式雨淋花洒，以及高速Wi-Fi和支持Chromecast的65英寸电视等科技设施。一座修复后的1900年法式殖民风格别墅更添遗产魅力。"],
        ["Sokha Phnom Penh Hotel is strategically located on peninsula Chroy Changvar. The hotel is situated opposite to the Royal Palace and approximately 30Km from Techo International Airport (KTI Airport, Phnom Penh).", "សណ្ឋាគារសុខា ភ្នំពេញ ស្ថិតនៅទីតាំងយុទ្ធសាស្ត្រលើឧបទ្វីបជ្រោយចង្វារ។ សណ្ឋាគារនេះស្ថិតនៅទល់មុខព្រះបរមរាជវាំង និងស្ថិតនៅចម្ងាយប្រហែល ៣០ គីឡូម៉ែត្រពីអាកាសយានដ្ឋានអន្តរជាតិតេជោ (អាកាសយានដ្ឋាន KTI ភ្នំពេញ)។", "金边索卡酒店地理位置优越，位于Chroy Changvar半岛。酒店与王宫隔河相望，距离德崇国际机场（KTI机场，金边）约30公里。"],
        ["SUN & MOON Riverside Hotel is a unique designed lifestyle ecosystem that integrates sophisticated, relaxing Wellness & Gym technologies with largescale events.", "សណ្ឋាគារ SUN & MOON Riverside គឺជាប្រព័ន្ធអេកូឡូស៊ីរបៀបរស់នៅដែលបានរចនាប្លែកពីគេ ដែលរួមបញ្ចូលបច្ចេកវិទ្យាសុខុមាលភាព និងកន្លែងហាត់ប្រាណដ៏ទំនើបសម្រាប់សម្រាកលំហែ ជាមួយព្រឹត្តិការណ៍ខ្នាតធំ។", "SUN & MOON 河畔酒店是一个设计独特的生活方式生态系统，将先进、放松的健康与健身科技与大型活动融为一体。"],
        ["A warm welcome to the Kingdom of Cambodia. Situated on the banks of the famous Mekong River, the magnificent Hotel Cambodiana is located in the heart of Phnom Penh’s central business and tourist districts, offering visitors convenient access to all that Phnom Penh has to offer.", "ស្វាគមន៍យ៉ាងកក់ក្តៅមកកាន់ព្រះរាជាណាចក្រកម្ពុជា។ ស្ថិតនៅលើច្រាំងទន្លេមេគង្គដ៏ល្បីល្បាញ សណ្ឋាគារ Hotel Cambodiana ដ៏អស្ចារ្យស្ថិតនៅចំកណ្តាលតំបន់អាជីវកម្ម និងទេសចរណ៍កណ្តាលរបស់ភ្នំពេញ ផ្តល់ជូនភ្ញៀវនូវការចូលដំណើរការងាយស្រួលទៅកាន់អ្វីៗទាំងអស់ដែលភ្នំពេញផ្តល់ជូន។", "热烈欢迎来到柬埔寨王国。著名的湄公河畔，宏伟的柬埔寨酒店（Hotel Cambodiana）坐落于金边中央商务区和旅游区的中心，让游客可以便捷地享受金边提供的一切。"],
        ["La Rose Suites is a boutique property situated in the heart of the city, on a quiet street near Independence Monument, the Royal Palace and the National Museum. It has 25 suites decorated with traditional Khmer and colonial touches that overlook lush tropical gardens or the saltwater swimming pool, a restaurant serving local and international cuisine, and a small spa.", "La Rose Suites ជាអចលនវត្ថុប៊ូទីកស្ថិតនៅចំកណ្តាលទីក្រុង លើផ្លូវស្ងាត់មួយជិតវិមានឯករាជ្យ ព្រះបរមរាជវាំង និងសារមន្ទីរជាតិ។ វាមានស៊ុយត ២៥ តុបតែងដោយទម្រង់ខ្មែរប្រពៃណី និងអាណានិគម ដែលមើលឃើញសួនត្រូពិចខៀវស្រងាត់ ឬអាងហែលទឹកទឹកប្រៃ ភោជនីយដ្ឋានដែលបម្រើម្ហូបក្នុងស្រុក និងអន្តរជាតិ និងស្ប៉ាតូចមួយ។", "La Rose Suites 是一家精品酒店，位于市中心一条安静的街道上，靠近独立纪念碑、王宫和国家博物馆。酒店共有25间套房，装饰融合传统高棉与殖民风格，可俯瞰郁郁葱葱的热带花园或咸水游泳池，设有供应本地和国际美食的餐厅以及一个小型水疗中心。"],
        ["Modern shopping mall in Phnom Penh.", "ផ្សារទំនើបទំនើបមួយនៅភ្នំពេញ។", "金边的一座现代购物中心。"],
        ["Cambodia International Film Festival", "មហោស្រពភាពយន្តអន្តរជាតិកម្ពុជា", "柬埔寨国际电影节"],
        ["As the nation’s largest film event, the Cambodia International Film Festival provides a platform for local and international filmmakers, aiming to foster cultural exchange through cinema. Free screenings and events are held at various venues around the city, highlighting both emerging talents and established artists.", "ជាព្រឹត្តិការណ៍ភាពយន្តធំបំផុតរបស់ជាតិ មហោស្រពភាពយន្តអន្តរជាតិកម្ពុជា ផ្តល់វេទិកាដល់អ្នកផលិតភាពយន្តក្នុងស្រុក និងអន្តរជាតិ ដោយមានគោលបំណងលើកកម្ពស់ការផ្លាស់ប្តូរវប្បធម៌តាមរយៈភាពយន្ត។ ការបញ្ចាំងភាពយន្តឥតគិតថ្លៃ និងព្រឹត្តិការណ៍ផ្សេងៗត្រូវបានរៀបចំនៅទីតាំងជាច្រើនជុំវិញទីក្រុង ដោយបង្ហាញទាំងទេពកោសល្យថ្មីៗ និងសិល្បករដែលមានឈ្មោះបាន។", "作为全国最大的电影盛事，柬埔寨国际电影节为本地和国际电影人提供平台，旨在通过电影促进文化交流。免费放映和活动在城市各处场地举行，既展示新锐人才，也呈现成名艺术家。"],
        ["The Vernal Equinox at Angkor Wat", "ទិវាសមរាត្រីនិទាឃរដូវនៅអង្គរវត្ត", "吴哥窟春分"],
        ["The Vernal Equinox at Angkor Wat (around March 20-23) is a spectacular event where the sun rises precisely over the central tower of Angkor Wat, a phenomenon showcasing ancient Khmer astronomy, drawing huge crowds to the western entrance for the sunrise alignment during the dry season, usually from March 21-23, with the precise date varying slightly yearly. Visitors arrive very early (4 AM) with cameras for this popular, memorable experience, though it’s essential to check the exact dates closer to March as it happens twice yearly, with September being the other equinox.", "សមរាត្រីនិទាឃរដូវនៅអង្គរវត្ត (ប្រហែលថ្ងៃទី ២០-២៣ មីនា) គឺជាព្រឹត្តិការណ៍អស្ចារ្យដែលព្រះអាទិត្យរះចំពីលើប៉មកណ្តាលនៃអង្គរវត្តយ៉ាងត្រឹមត្រូវ ជាបាតុភូតដែលបង្ហាញពីតារាសាស្ត្រខ្មែរបុរាណ ទាក់ទាញហ្វូងមនុស្សយ៉ាងច្រើនមកកាន់ច្រកចូលខាងលិច ដើម្បីមើលការតម្រឹមពេលថ្ងៃរះក្នុងរដូវប្រាំង ជាធម្មតាចាប់ពីថ្ងៃទី ២១-២៣ មីនា ហើយកាលបរិច្ឆេទជាក់លាក់ប្រែប្រួលបន្តិចបន្តួចក្នុងមួយឆ្នាំៗ។ អ្នកទស្សនាមកដល់តាំងពីព្រលឹមស្រាងៗ (ម៉ោង ៤ ព្រឹក) ជាមួយកាមេរ៉ាសម្រាប់បទពិសោធន៍ដ៏ពេញនិយម និងគួរឲ្យចងចាំនេះ ទោះបីជាចាំបាច់ត្រូវពិនិត្យកាលបរិច្ឆេទជាក់លាក់ជិតដល់ខែមីនាក៏ដោយ ព្រោះវាកើតឡើងពីរដងក្នុងមួយឆ្នាំ ដោយខែកញ្ញាជាសមរាត្រីមួយទៀត។", "吴哥窟春分（约3月20日至23日）是一场壮观的盛事：太阳恰好从吴哥窟中央塔楼上方升起，展现了古代高棉的天文学成就，在旱季吸引大批游客涌向西门观看日出对齐，通常在3月21日至23日，确切日期每年略有不同。游客们凌晨4点便带着相机赶来，体验这一热门而难忘的景象，不过临近3月时务必确认确切日期，因为这一现象每年出现两次，另一次是9月的秋分。"],
        ["River Festival", "មហោស្រពទន្លេ", "河流节"],
        ["A government-led festival promoting the Mekong and Tonlé Sap, rotating between provinces (Kratie, Kampong Cham, etc.). Features boat races, cultural shows, and tourism exhibitions.", "មហោស្រពដែលដឹកនាំដោយរដ្ឋាភិបាល ដើម្បីលើកកម្ពស់ទន្លេមេគង្គ និងទន្លេសាប ដោយបង្វិលជុំរវាងខេត្តនានា (ក្រចេះ កំពង់ចាម ។ល។)។ មានការប្រណាំងទូក ការសម្តែងវប្បធម៌ និងពិព័រណ៍ទេសចរណ៍។", "由政府主导的节庆，旨在推广湄公河和洞里萨湖，在各省（桔井、磅湛等）轮流举办。包含龙舟赛、文化演出和旅游展览。"],
        ["The 10th River Festival will be organized in Pursat Province this year.", "មហោស្រពទន្លេលើកទី ១០ នឹងត្រូវរៀបចំនៅខេត្តពោធិ៍សាត់ក្នុងឆ្នាំនេះ។", "第十届河流节今年将在菩萨省举办。"],
        ["Khmer New Year (Choul Chnam Thmey)", "បុណ្យចូលឆ្នាំខ្មែរ (ចូលឆ្នាំថ្មី)", "高棉新年（Choul Chnam Thmey）"],
        ["Marking the traditional New Year in Cambodia, and the end of the harvest season, this three-day festival is one of the nation’s largest celebrations. People often visit a local temple and honour the Buddha and his disciples by building mountains made of sand. A popular treat during this festival is kralan, a dessert made from steamed rice, beans and coconut milk.", "ជាការសម្គាល់ពីឆ្នាំថ្មីប្រពៃណីនៅកម្ពុជា និងការបញ្ចប់រដូវប្រមូលផល ពិធីបុណ្យរយៈពេលបីថ្ងៃនេះគឺជាការប្រារព្ធដ៏ធំបំផុតមួយរបស់ប្រទេស។ ប្រជាជនច្រើនតែទៅវត្តក្នុងតំបន់ និងគោរពព្រះពុទ្ធ និងសាវ័ករបស់ព្រះអង្គ ដោយការពូនភ្នំខ្សាច់។ អាហារដែលពេញនិយមក្នុងអំឡុងពេលបុណ្យនេះគឺនំក្រឡាន ដែលជានំធ្វើពីអង្ករចំហុយ សណ្តែក និងទឹកដោះគោដូង។", "这个节日标志着柬埔寨传统新年和收获季节的结束，为期三天，是全国最盛大的庆典之一。人们常去当地寺庙，通过堆沙山来敬奉佛陀及其弟子。节日期间受欢迎的美食是糯米竹筒饭（kralan），由蒸糯米、豆子和椰奶制成。"],
        ["Royal Ploughing Ceremony", "ព្រះរាជពិធីច្រត់ព្រះនង្គ័ល", "皇家春耕节"],
        ["This traditional event in Cambodia marks the start of the rice-growing season. At the end of the dry season, the King presides over a centuries-old ceremony where royal oxen are presented with various crops. What they consume is believed to predict the agricultural fortune of the upcoming season.", "ព្រឹត្តិការណ៍ប្រពៃណីនេះនៅកម្ពុជាសម្គាល់ការចាប់ផ្តើមនៃរដូវដាំស្រូវ។ នៅចុងរដូវប្រាំង ព្រះមហាក្សត្រទ្រង់ជាព្រះរាជាធិបតីក្នុងពិធីដ៏ចំណាស់រាប់សតវត្សរ៍ ដែលគោរាជត្រូវបានយកមកបង្ហាញជាមួយដំណាំផ្សេងៗ។ អ្វីដែលពួកវាស៊ីត្រូវបានគេជឿថាអាចព្យាករណ៍ពីសំណាងកសិកម្មនៃរដូវកាលខាងមុខ។", "这项柬埔寨传统活动标志着水稻种植季的开始。旱季结束时，国王主持这一有数百年历史的仪式，王室耕牛面前会摆放各种农作物。人们相信，它们所吃的东西可以预示来季的农业收成。"],
        ["Phnom Penh International Half Marathon", "ការប្រណាំងពាក់កណ្តាលម៉ារ៉ាតុងអន្តរជាតិភ្នំពេញ", "金边国际半程马拉松"],
        ["Starting and finishing in front of the Royal Palace, this annual event takes participants on a scenic route through the heart of Phnom Penh. Runners will pass along the banks of the Mekong River, a key aspect of the city’s charm and character. The event also celebrates the birthday of Queen Norodom Monineath Sihanouk.", "ចាប់ផ្តើម និងបញ្ចប់នៅមុខព្រះបរមរាជវាំង ព្រឹត្តិការណ៍ប្រចាំឆ្នាំនេះនាំអ្នកចូលរួមតាមផ្លូវដ៏ស្រស់ស្អាតកាត់ចំកណ្តាលទីក្រុងភ្នំពេញ។ អ្នករត់នឹងរត់កាត់តាមមាត់ទន្លេមេគង្គ ដែលជាចំណុចសំខាន់នៃមន្តស្នេហ៍ និងលក្ខណៈរបស់ទីក្រុង។ ព្រឹត្តិការណ៍នេះក៏ប្រារព្ធព្រះរាជពិធីចម្រើនព្រះជន្មសម្តេចព្រះមហាក្សត្រី នរោត្តម មុនីនាថ សីហនុ ផងដែរ។", "活动以王宫前为起终点，每年一度，带参赛者沿风景优美的路线穿越金边市中心。跑者将沿湄公河岸奔跑，这是这座城市魅力与特色的重要部分。该活动同时也庆祝莫尼列太后（诺罗敦·莫尼列·西哈努克）的生日。"],
        ["The Autumnal Equinox at Angkor", "ទិវាសមរាត្រីសរទរដូវនៅអង្គរ", "吴哥秋分"],
        ["The autumnal equinox sun alignment at Angkor Wat, mirroring the vernal equinox phenomenon. The sun rises precisely over the central tower, drawing visitors who arrive in the early hours (4 AM) to witness this ancient Khmer astronomical wonder.", "ការតម្រឹមព្រះអាទិត្យសមរាត្រីសរទរដូវនៅអង្គរវត្ត ដែលឆ្លុះបញ្ចាំងពីបាតុភូតសមរាត្រីនិទាឃរដូវ។ ព្រះអាទិត្យរះចំពីលើប៉មកណ្តាលយ៉ាងត្រឹមត្រូវ ទាក់ទាញអ្នកទស្សនាដែលមកដល់ពេលព្រលឹម (ម៉ោង ៤ ព្រឹក) ដើម្បីឃើញអច្ឆរិយៈតារាសាស្ត្រខ្មែរបុរាណនេះ។", "吴哥窟秋分的日出对齐现象，与春分现象遥相呼应。太阳恰好从中央塔楼上方升起，吸引游客凌晨（4点）赶来，见证这一古代高棉天文奇观。"],
        ["The Water Festival (Bon Om Touk)", "បុណ្យអុំទូក អកអំបុក សំពះព្រះខែ (បុណ្យអុំទូក)", "送水节（Bon Om Touk）"],
        ["The Water Festival (Bon Om Touk) in Cambodia is a vibrant, three-day celebration in late October or November marking the reversal of the Tonle Sap River, signifying the end of the rainy season and welcoming the fishing season, featuring spectacular dragon boat races, illuminated floating boats, fireworks, and traditional feasts, particularly grand in Phnom Penh along the Tonle Sap River.", "បុណ្យអុំទូក (បុណ្យអុំទូក អកអំបុក សំពះព្រះខែ) នៅកម្ពុជា គឺជាការប្រារព្ធដ៏រស់រវើករយៈពេលបីថ្ងៃនៅចុងខែតុលា ឬខែវិច្ឆិកា ដែលសម្គាល់ពីការហូរបញ្ច្រាសនៃទន្លេសាប បង្ហាញពីការបញ្ចប់រដូវវស្សា និងស្វាគមន៍រដូវនេសាទ ដោយមានការប្រណាំងទូកង៉ែតអស្ចារ្យ ទូកអណ្តែតមានពន្លឺ កាំជ្រួច និងពិធីជប់លៀងប្រពៃណី ជាពិសេសយ៉ាងអធិកអធមនៅភ្នំពេញតាមបណ្តោយទន្លេសាប។", "柬埔寨的送水节（Bon Om Touk）是十月底或十一月举行的为期三天的热闹庆典，标志着洞里萨河水流逆转，象征雨季结束、捕鱼季到来，有精彩的龙舟赛、灯火通明的漂浮船、烟花和传统盛宴，尤其在金边沿洞里萨河一带最为盛大。"]
    ]);

    add([

        ["Launched by Cambodia's National Police Anti-Cybercrime Department, the Kapea Scams App allows users to report online fraud and technology-related scams directly to authorities. The system tracks fraud patterns and helps automatically block inbound calls from verified scam-linked phone numbers.", "ដាក់ឱ្យប្រើដោយនាយកដ្ឋានប្រឆាំងឧក្រិដ្ឋកម្មតាមប្រព័ន្ធអេឡិចត្រូនិកនៃប៉ូលិសជាតិកម្ពុជា កម្មវិធី Kapea Scams អនុញ្ញាតឱ្យអ្នកប្រើរាយការណ៍ការបោកប្រាស់តាមអនឡាញ និងការបោកប្រាស់ពាក់ព័ន្ធបច្ចេកវិទ្យាដោយផ្ទាល់ទៅអាជ្ញាធរ។ ប្រព័ន្ធតាមដានលំនាំនៃការបោកប្រាស់ និងជួយទប់ស្កាត់ដោយស្វ័យប្រវត្តិនូវការហៅចូលពីលេខទូរស័ព្ទដែលបានបញ្ជាក់ថាទាក់ទងនឹងការបោកប្រាស់។", "由柬埔寨国家警察反网络犯罪局推出，Kapea Scams 应用允许用户直接向当局举报网络诈骗和科技相关骗局。该系统追踪诈骗模式，并帮助自动拦截来自已确认诈骗号码的来电。"],

        ["Launched by the Phnom Penh City Bus Authority in cooperation with JICA, the City Bus Official App is a vital utility for navigating Phnom Penh. It tracks over 200 city buses across 13 distinct public routes in real-time using live GPS data. It lets you view nearby stops, see estimated arrival times, and sends a proximity alert when a bus is 200 meters away.", "ដាក់ឱ្យប្រើដោយអាជ្ញាធរឡានក្រុងក្រុងភ្នំពេញ សហការជាមួយ JICA កម្មវិធី City Bus Official App ជាឧបករណ៍សំខាន់សម្រាប់ធ្វើដំណើរក្នុងរាជធានីភ្នំពេញ។ វាតាមដានឡានក្រុងជាង ២០០ គ្រឿង លើខ្សែផ្លូវសាធារណៈ ១៣ ខ្សែ ក្នុងពេលវេលាជាក់ស្តែងដោយប្រើទិន្នន័យ GPS ផ្ទាល់។ អ្នកអាចមើលចំណតនៅជិត ពេលមកដល់ប៉ាន់ស្មាន និងទទួលការជូនដំណឹងនៅពេលឡានក្រុងនៅចម្ងាយ ២០០ ម៉ែត្រ។", "由金边市公交管理局与 JICA 合作推出，City Bus Official App 是在金边出行的重要工具。它使用实时 GPS 数据，实时追踪 13 条公共线路上的 200 多辆市内巴士。您可以查看附近站点、预计到达时间，并在公交车距离 200 米时收到临近提醒。"],

    const roleWord = (r, l) => r === 'Guest' ? pick(l, 'ភ្ញៀវ', '访客') : r === 'Admin' ? pick(l, 'អ្នកគ្រប់គ្រង', '管理员') : r;
    RULES.push([/^Tap a star to rate as (.+)$/, (m, l) => pick(l, `ចុចផ្កាយដើម្បីវាយតម្លៃក្នុងនាមជា ${roleWord(m[1], l)}`, `点击星星以${roleWord(m[1], l)}身份评分`)]);
    RULES.push([/^Your rating: (\d)★ \(as (.+)\)$/, (m, l) => pick(l, `ការវាយតម្លៃរបស់អ្នក៖ ${m[1]}★ (ក្នុងនាមជា ${roleWord(m[2], l)})`, `您的评分：${m[1]}★（${roleWord(m[2], l)}身份）`)]);

    function translate(core, l) {
        if (!core || !/[A-Za-z]/.test(core) || (l !== 'km' && l !== 'zh')) return null;
        let r = lookup(core, l);
        if (r) return r;
        const n = norm(core);
        for (const [re, fn] of RULES) { const m = n.match(re); if (m) { const out = fn(m, l); if (out) return out; } }
        // "A • B • C" (category • province, interests, distances ...)
        if (n.indexOf(' • ') !== -1) {
            let changed = false;
            const parts = n.split(' • ').map(p => { const t = translate(p, l); if (t != null) changed = true; return t == null ? p : t; });
            if (changed) return parts.join(' • ');
        }
        // "...text.Location: X" (tags stripped on event cards) and sentences glued together without a space

        const seg = n.split(/(?<=[.!?])(?=[A-Z])/);
        if (seg.length > 1) {
            let changed = false;
            const out = seg.map(s => { const t = translate(s, l); if (t != null) changed = true; return t == null ? s : t; });

    // ---- DOM walker (keeps the original English so we can switch language back and forth) ----
    const origText = new WeakMap(), lastText = new WeakMap(), origAttr = new WeakMap();

    function doText(node) {
        const cur = node.nodeValue;
        let orig = origText.get(node);
        if (orig === undefined || cur !== lastText.get(node)) { orig = cur; origText.set(node, orig); }
        let res = orig;

            const core = orig.trim();
            const tr = translate(core, l);
            if (tr != null) res = orig.match(/^\s*/)[0] + tr + orig.match(/\s*$/)[0];
        }
        if (res !== cur) node.nodeValue = res;
        lastText.set(node, res);
    }
    function doAttrs(el) {
        ATTRS.forEach(a => {
            if (!el.hasAttribute || !el.hasAttribute(a)) return;
            const cur = el.getAttribute(a);

            if (!rec[a] || cur !== rec[a].last) rec[a] = { orig: cur, last: cur };
            const l = lang();
            let res = rec[a].orig;
            if (l !== 'en') { const tr = translate(res, l); if (tr != null) res = tr; }
            if (res !== cur) el.setAttribute(a, res);

    }
    function walk(root) {
        if (!root) return;
        if (root.nodeType === 3) { if (!(root.parentNode && SKIP[root.parentNode.nodeName])) doText(root); return; }

        const tw = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);

        if (tag === 'IFRAME' && /netlify/i.test(el.getAttribute('src') || '')) return true;
        // closed shadow DOM: a custom element (tag contains "-") added outside the app
        if (tag.indexOf('-') > -1 && !el.closest('#app')) return true;
        return false;
    }
    function hide(el) { el.style.setProperty('display', 'none', 'important'); el.setAttribute('aria-hidden', 'true'); }
    function sweep() {
        try {
            [document.body, document.documentElement].forEach(function (root) {
                if (!root) return;
                for (var i = 0; i < root.children.length; i++) {
                    var el = root.children[i];
                    if (isBadge(el)) hide(el);
                }
            });
        } catch (e) {}
    }
    sweep();
    document.addEventListener('DOMContentLoaded', sweep);
    window.addEventListener('load', sweep);
    try {
        var mo = new MutationObserver(sweep);
        mo.observe(document.documentElement, { childList: true });
        document.addEventListener('DOMContentLoaded', function () { mo.observe(document.body, { childList: true }); });
    } catch (e) {}
    var n = 0, t = setInterval(function () { sweep(); if (++n > 100) clearInterval(t); }, 300);
})();
</script>
