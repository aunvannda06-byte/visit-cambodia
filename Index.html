<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Visit Cambodia 🇰🇭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root { --primary: #0369a1; --accent: #f59e0b; --bg-body: #f1f5f9; }
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: var(--bg-body); -webkit-tap-highlight-color: transparent; user-select: none; overflow-x: hidden; }
        .flag-animation { display: inline-block; animation: wave 2.5s infinite ease-in-out; transform-origin: bottom left; }
        @keyframes wave { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(8deg) translateY(-2px)} 75%{transform:rotate(-5deg) translateY(1px)} }
        .loader-spinner { width:24px;height:24px;border:3px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin 0.6s cubic-bezier(0.5,0.1,0.5,0.9) infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .tab-bar { position:fixed;bottom:0;width:100%;max-width:500px;height:75px;background:rgba(255,255,255,0.98);backdrop-filter:blur(15px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e2e8f0;z-index:1000;padding-bottom:env(safe-area-inset-bottom); }
        .tab-item { display:flex;flex-direction:column;align-items:center;color:#94a3b8;font-size:8.5px;font-weight:600;transition:all 0.2s ease;padding:0 1px; }
        .tab-item.active { color:var(--primary); }
        .tab-item i { font-size:16px;margin-bottom:3px;width:34px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:14px;transition:all 0.2s ease; }
        .tab-item.active i { background:#e0f2fe;color:var(--primary);transform:scale(1.06);width:34px;height:34px;border-radius:50%; }
        .tab-item.active span { color:var(--primary); }
        /* AI Guide only gets the raised FAB treatment while it is the SELECTED tab — otherwise it looks like any other tab */
        .tab-item.tab-fab.active { position:relative;top:-18px; }
        .tab-item.tab-fab.active i { width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#0ea5e9,#0369a1);color:#fff;font-size:20px;box-shadow:0 8px 16px rgba(3,105,161,0.4);margin-bottom:4px;transform:scale(1.02); }
        .tab-item.tab-fab.active span { color:var(--primary);font-weight:700; }
        /* Star rating */
        .rating-pill { display:inline-flex;align-items:center;gap:4px;font-weight:800; }
        .rating-pill i { color:#f59e0b; }
        .star-picker i { cursor:pointer;transition:transform 0.1s ease; }
        .star-picker i:active { transform:scale(0.85); }
        .no-scrollbar::-webkit-scrollbar { display:none; }
        .no-scrollbar { -ms-overflow-style:none;scrollbar-width:none; }
        .dropdown-content { display:none;overflow:hidden;transition:all 0.3s ease; }
        .img-indicator { position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:white;padding:4px 8px;border-radius:10px;font-size:10px;backdrop-filter:blur(5px);display:flex;align-items:center;gap:4px; }
        .modal-animate { animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1); }
        @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        .search-input:focus { background:#fff;border:2px solid var(--primary); }

        /* Settings style matching the photo */
        .settings-card { background:#fff;border-radius:22px;border:1px solid #f1f5f9;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden;margin-bottom:16px; }
        .settings-row { padding:18px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s; }
        .settings-row:active { background:#f8fafc; }
        .settings-row-icon { width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-right:14px;flex-shrink:0; }
        .settings-divider { height:1px;background:#f1f5f9;margin:0 20px; }
        .settings-section-label { font-size:12px;font-weight:700;color:#94a3b8;letter-spacing:0.08em;text-transform:uppercase;padding:10px 4px 8px; }

        /* Story / TikTok styles */
        .story-container { position:relative;width:100%;height:calc(100vh - 75px);overflow:hidden;background:#000; }
        .story-video-wrap { width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden; }
        .story-video-wrap video, .story-video-wrap img { width:100%;height:100%;object-fit:cover; }
        /* Location detail popup: show each photo in full whatever its resolution/aspect ratio */
        img.fit-full { object-fit:contain !important; background-color:#e2e8f0; }
        .story-overlay { position:absolute;bottom:0;left:0;right:0;padding:20px 16px 30px;background:linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%); }
        .story-progress-bar { position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:8px 10px;z-index:10; }
        .story-progress-seg { flex:1;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden; }
        .story-progress-fill { height:100%;background:#fff;width:0%;transition:width 0.1s linear; }
        .story-actions { display:flex;flex-direction:column;align-items:center;gap:18px;position:absolute;right:12px;bottom:80px; }
        .story-action-btn { display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-size:11px;cursor:pointer; }
        .story-action-btn i { font-size:24px; }

        /* Login form */
        .login-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:3000;display:flex;align-items:flex-end;justify-content:center; }
        .login-sheet { background:#fff;border-radius:32px 32px 0 0;width:100%;max-width:500px;padding:32px 28px 48px;animation:slideUp 0.35s cubic-bezier(0.4,0,0.2,1); }
        .google-btn { width:100%;height:54px;border:2px solid #e2e8f0;border-radius:16px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;cursor:pointer;transition:background 0.15s; }
        .google-btn:active { background:#f8fafc; }

        /* Favourite heart animation */
        @keyframes heartPop { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }
        .heart-pop { animation:heartPop 0.3s ease; }

        /* Currency converter white bg */
        .currency-card { background:#fff;border-radius:22px;border:1px solid #e2e8f0;padding:24px;margin-bottom:8px; }

        /* Story upload preview */
        /* ===== DESKTOP / LARGE SCREENS (phones & tablets are unchanged) ===== */
        .ess-btn.ess-active { background:#0284c7; border-color:#0284c7; color:#fff; box-shadow:0 4px 10px rgba(2,132,199,.25); }
        @media (min-width:1024px) {
            body { background:linear-gradient(180deg,#e8f1f8 0%,#f1f5f9 100%); }
            #app { max-width:1180px !important; padding-bottom:130px !important; box-shadow:0 0 60px rgba(15,23,42,0.08) !important; }
            #main-header { padding-left:40px !important; padding-right:40px !important; }
            #main-content { padding:28px 40px !important; }
            /* floating centered nav pill instead of a stretched bottom bar */
            .tab-bar { left:50%; transform:translateX(-50%); bottom:18px; max-width:620px; border:1px solid #e2e8f0; border-radius:26px; box-shadow:0 12px 40px rgba(15,23,42,0.14); }
            #ai-input-bar { left:50%; transform:translateX(-50%); bottom:104px; max-width:720px !important; border:1px solid #e2e8f0; border-radius:22px; box-shadow:0 8px 28px rgba(15,23,42,0.10); }
            #main-content[data-tab="aiguide"] { max-width:760px; margin:0 auto; }
            /* Home: two columns on top */
            .home-top { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:48px; align-items:start; }
            #main-content[data-tab="home"] .pt-8 .grid-cols-4 { max-width:560px; }
            /* lists become card grids */
            .list-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
            .list-grid > * { margin:0 !important; }
            #trend-grid { grid-template-columns:repeat(3,minmax(0,1fr)) !important; column-gap:24px !important; row-gap:32px !important; }
            #main-content[data-tab="setting"] .grid-cols-2 { grid-template-columns:repeat(3,minmax(0,1fr)); }
            /* popups: centered cards instead of phone-style bottom sheets */
            #details-modal, #info-modal, #admin-content-modal, #weather-modal { align-items:center !important; }
            #details-modal > div, #info-modal > div, #admin-content-modal > div, #weather-modal > div { max-width:680px !important; border-radius:28px !important; max-height:88vh !important; }
            #video-modal > div { max-width:min(1180px, calc((100vh - 150px) * 16 / 9)) !important; }
            #plantrip-body { max-width:720px !important; }
            /* Essentials: 2 images per row on desktop (apps / transport) */
            .ess-grid { display:grid !important; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.25rem; }
            .ess-grid > * { margin:0 !important; }
            .ess-grid > .ess-span { grid-column:1 / -1; }
        }
        /* Hide Netlify's "Powered by Netlify" badge */
        #netlify-badge, .netlify-badge, [id*="netlify-badge"], [class*="netlify-badge"], a[href*="netlify.com/?utm"], a[href*="app.netlify.com/drop"], iframe[src*="netlify"] { display:none !important; }
        .ess-img { display:block; width:100%; height:160px; object-fit:cover; object-position:center; background:#e2e8f0; }
        .upload-area { border:2px dashed #cbd5e1;border-radius:20px;padding:32px;text-align:center;cursor:pointer; }
        /* Home: Nearby places in two rows, swipe sideways for more */
        .nearby-scroll { display:grid; grid-auto-flow:column; grid-template-rows:repeat(3,auto); grid-auto-columns:88%; gap:12px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x mandatory; -ms-overflow-style:none; scrollbar-width:none; }
        .nearby-scroll::-webkit-scrollbar { display:none; }
        .nearby-scroll > * { scroll-snap-align:start; margin:0 !important; min-width:0; }
        /* Home: category filter chips in two rows, swipe sideways for more */
        .chip-scroll { display:grid; grid-auto-flow:column; grid-template-rows:repeat(2,2.1rem); grid-auto-columns:calc(50% - 4px); gap:6px 8px; height:5.2rem; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; }
        .chip-scroll > button { flex:none; height:2.1rem; padding-top:0 !important; padding-bottom:0 !important; display:inline-flex; align-items:center; justify-content:center; text-align:center; scroll-snap-align:start; }
        /* Trending: Grid (16:9) + Shorts (9:16). Phones: switch between the two. Desktop: Grid on top, Shorts below. */
        @media (max-width:1023px) {
            #trend-body[data-view="grid"] #trend-sec-shorts { display:none; }
            #trend-body[data-view="shorts"] #trend-sec-grid { display:none; }
            .trend-sec-head { display:none !important; }
        }
        @media (min-width:1024px) {
            .trend-tabs { display:none !important; }
            #trend-sec-shorts { margin-top:36px; }
            #trend-shorts { grid-template-columns:repeat(4,minmax(0,1fr)) !important; column-gap:20px !important; row-gap:24px !important; }
        }
    </style>
</head>
<body class="flex justify-center">
<div id="app" class="w-full max-w-[500px] min-h-screen bg-white shadow-2xl relative pb-28">

    <!-- Header -->
    <header class="p-5 sticky top-0 bg-white/95 backdrop-blur-md z-[100] flex justify-between items-center border-b border-slate-100" id="main-header">
        <div class="min-w-0">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold text-sky-800">Visit Cambodia</span>
                <span class="flag-animation text-2xl">🇰🇭</span>
            </div>
            <p class="text-[10px] leading-snug text-slate-400 font-semibold mt-0.5 pr-2">Your Gateway to Cambodia — Where Every Journey Tells a Story.</p>
        </div>
        <div class="flex gap-3 flex-shrink-0">
            <button onclick="openNotifications()" aria-label="Notifications" class="relative w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-500"><i class="fa-solid fa-bell"></i><span id="notif-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-rose-500 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white"></span></button>
            <button onclick="switchTab('explore')" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-500"><i class="fa-solid fa-search"></i></button>
        </div>
    </header>

    <div id="main-content" class="p-4"></div>

    <!-- Tab Bar -->
    <nav class="tab-bar">
        <button onclick="switchTab('home')" id="tab-home" class="tab-item active"><i class="fa-solid fa-house-chimney"></i><span>Home</span></button>
        <button onclick="switchTab('aiguide')" id="tab-aiguide" class="tab-item tab-fab"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI Guide</span></button>
        <button onclick="switchTab('trending')" id="tab-trending" class="tab-item"><i class="fa-solid fa-fire"></i><span>Trending</span></button>
        <button onclick="switchTab('explore')" id="tab-explore" class="tab-item"><i class="fa-solid fa-map-location-dot"></i><span>Explore</span></button>
        <button onclick="switchTab('favourite')" id="tab-favourite" class="tab-item"><i class="fa-solid fa-heart"></i><span>My Journey</span></button>
        <button onclick="switchTab('setting')" id="tab-setting" class="tab-item"><i class="fa-solid fa-toolbox"></i><span>Essentials</span></button>
    </nav>

    <!-- AI Guide Input Bar (shown only on the AI Guide tab) -->
    <div id="ai-input-bar" class="fixed bottom-[75px] w-full max-w-[500px] bg-white/95 backdrop-blur-md border-t border-slate-100 px-4 py-3 z-[999] hidden">
        <div class="flex items-center gap-2">
            <input type="text" id="ai-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendAIMessage()" class="flex-1 h-12 bg-slate-50 rounded-full px-5 text-sm outline-none border border-slate-100 focus:border-sky-600">
            <button onclick="sendAIMessage()" class="w-12 h-12 rounded-full bg-sky-700 text-white flex items-center justify-center flex-shrink-0 active:scale-95 transition-all"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="details-modal" class="fixed inset-0 bg-black/60 z-[2000] hidden flex items-end sm:items-center justify-center" onclick="closeModal()">
    <div class="bg-white w-full max-w-md rounded-t-[35px] sm:rounded-[35px] overflow-y-auto max-h-[92vh] modal-animate" onclick="event.stopPropagation()">
        <div id="modal-body"></div>
    </div>
</div>



<!-- Video Player Modal (Trending) -->
<div id="video-modal" class="fixed inset-0 bg-black/80 z-[2700] hidden flex items-center justify-center p-4" onclick="closeVideoModal()">
    <div class="w-full max-w-md" onclick="event.stopPropagation()">
        <div id="video-modal-body"></div>
    </div>
</div>

<!-- Info Modal (Settings) -->
<div id="info-modal" class="fixed inset-0 bg-black/60 z-[2500] hidden flex items-end justify-center" onclick="closeInfoModal()">
    <div class="bg-white w-full max-w-md rounded-t-[35px] overflow-y-auto max-h-[90vh] modal-animate" onclick="event.stopPropagation()">
        <div id="info-modal-body" class="pb-10"></div>
    </div>
</div>

<!-- Admin Login Modal -->
<div id="login-modal" class="login-overlay" style="display:none;" onclick="closeAdminLogin()">
    <div class="login-sheet" onclick="event.stopPropagation()">
        <div id="login-modal-body"></div>
    </div>
</div>

<!-- Admin Content Modal (Add Location / Add Event) -->
<div id="admin-content-modal" class="fixed inset-0 bg-black/60 z-[2600] hidden flex items-end justify-center" onclick="closeAdminContentModal()">
    <div class="bg-white w-full max-w-md rounded-t-[35px] overflow-y-auto max-h-[92vh] modal-animate" onclick="event.stopPropagation()">
        <div id="admin-content-modal-body" class="pb-10"></div>
    </div>
</div>

<!-- Plan My Trip (full-screen flow) -->
<div id="plantrip-modal" class="fixed inset-0 bg-white z-[2200] hidden overflow-y-auto">
    <div id="plantrip-body" class="max-w-[500px] mx-auto min-h-screen pb-10"></div>
</div>

<!-- Weather Modal -->
<div id="weather-modal" class="fixed inset-0 bg-black/60 z-[2400] hidden flex items-end justify-center" onclick="closeWeather()">
    <div class="bg-white w-full max-w-md rounded-t-[35px] overflow-y-auto max-h-[88vh] modal-animate" onclick="event.stopPropagation()">
        <div id="weather-modal-body" class="p-6"></div>
    </div>
</div>

<script>
// ===== MOBILE BACK BUTTON: close modals instead of leaving the app =====
// Every time a modal/sheet opens we push one history entry. Pressing the phone's
// physical/gesture Back button then fires 'popstate', which closes the topmost
// open modal (returning to whatever tab was already selected underneath) instead
// of navigating the browser away from the app.
let modalHistoryDepth = 0;
let suppressPopstateClose = false;

function pushModalHistory() {
    modalHistoryDepth++;
    history.pushState({ cambodiaModal: modalHistoryDepth }, '');
}
// Called from inside a normal close___() function (X button, backdrop tap, action
// buttons) to keep browser history in sync with what's actually on screen.
function popModalHistory() {
    if (modalHistoryDepth > 0) {
        modalHistoryDepth--;
        suppressPopstateClose = true;
        history.back();
    }
}
// Back also walks back through the sections (Home -> Explore -> Trending ...) and never leaves the app:
// one "guard" history entry is always kept in front, and re-created every time Back consumes it.
let tabStack = ['home'];
let navFromBack = false;
function armBackGuard() { try { history.pushState({ cambodiaGuard: 1 }, ''); } catch (e) {} }
try { history.replaceState({ cambodiaRoot: 1 }, ''); } catch (e) {}
// created on the first tap (browsers ignore history entries added without a user gesture)
window.addEventListener('pointerdown', armBackGuard, { once: true });
window.addEventListener('popstate', function () {
    if (suppressPopstateClose) { suppressPopstateClose = false; return; }
    if (modalHistoryDepth > 0) {
        modalHistoryDepth--;
        closeTopmostModalSilently();
        return;
    }
    if (tabStack.length > 1) {
        tabStack.pop();
        navFromBack = true;
        try { switchTab(tabStack[tabStack.length - 1]); } finally { navFromBack = false; }
    }
    armBackGuard();
});
// Hides whichever modal is currently visible without touching history again
// (history is already correct by the time this runs, from popstate).
function closeTopmostModalSilently() {
    const checks = [
        ['video-modal', el => { destroyYtPlayer(); el.classList.add('hidden'); document.getElementById('video-modal-body').innerHTML = ''; }],
        ['admin-content-modal', el => el.classList.add('hidden')],
        ['login-modal', el => el.style.display = 'none'],
        ['weather-modal', el => el.classList.add('hidden')],
        ['plantrip-modal', el => el.classList.add('hidden')],
        ['info-modal', el => el.classList.add('hidden')],
        ['details-modal', el => el.classList.add('hidden')]
    ];
    for (const [id, hide] of checks) {
        const el = document.getElementById(id);
        if (!el) continue;
        const visible = id === 'login-modal' ? el.style.display === 'flex' : !el.classList.contains('hidden');
        if (visible) { hide(el); return; }
    }
}

// ===== DATA =====
const CATEGORIES = ["Things to do","Temple","Food&Drink","Eco Tourism","Hotel","Resort/Boutique","Sea/Beach","Camping","Khmer Food","Street Food","Shopping Mall","Mart","Local Market","Souvenirs","Sky Bar","Massage&Spa","Money Exchange","Transporation","Phamarcy","Museum","Garden/Park","Natural Coffee","Restaurant (Nature)","Gas Station"];

// ===== HOME: CATEGORY GROUPS (Home page "Categories" icons) =====
const HOME_GROUPS = [
    { id:'Things to do', label:'Things to do', i:'fa-binoculars', color:'bg-amber-500',
      subs:['Temple','Eco Tourism','Sea/Beach','Camping','Museum','Garden/Park'], extra:['Things to do','EcoTourism'] },
    { id:'Food & Drink', label:'Food & Drink', i:'fa-bowl-food', color:'bg-emerald-500',
      subs:['Khmer Food','Street Food','Natural Coffee','Restaurant (Nature)','Sky Bar'], extra:['Food&Drink'] },
    { id:'Stay', label:'Stay', i:'fa-hotel', color:'bg-blue-500',
      subs:['Hotel','Resort/Boutique'], extra:[] },
    { id:'Shopping', label:'Shopping', i:'fa-cart-shopping', color:'bg-rose-500',
      subs:['Shopping Mall','Mart','Local Market','Souvenirs'], extra:[] },
    { id:'Travel Essentials', label:'Travel Essentials', i:'fa-suitcase-rolling', color:'bg-teal-500',
      subs:['Money Exchange','Transportation','Pharmacy','Gas Station'], extra:[] },
    { id:'Wellness & Relaxation', label:'Wellness & Relaxation', i:'fa-spa', color:'bg-purple-500',
      subs:['Massage & Spa'], extra:[] }
];
// Stored category values (kept exactly as they are in the data / Google Sheet, including old spellings)
const HOME_GROUP_MEMBERS = {
    'Things to do': ['Things to do','Temple','Eco Tourism','EcoTourism','Sea/Beach','Camping','Museum','Garden/Park'],
    'Food & Drink': ['Food&Drink','Khmer Food','Street Food','Natural Coffee','Restaurant (Nature)','Sky Bar'],
    'Stay': ['Hotel','Resort/Boutique'],
    'Shopping': ['Shopping Mall','Mart','Local Market','Souvenirs'],
    'Travel Essentials': ['Money Exchange','Transporation','Transportation','Phamarcy','Pharmacy','Gas Station'],
    'Wellness & Relaxation': ['Massage&Spa']
};

// ===== PLACEHOLDER PHOTO (used when "Add New Location" has no photo) =====
// The sheet stores photos as a comma-separated list, so we save a tiny token ("placeholder:Gas Station")
// and turn it into a white SVG image (with the category name) when the app loads / saves.
const PH_PREFIX = 'placeholder:';
const PH_LABELS = { 'Food&Drink':'Food & Drink', 'Massage&Spa':'Massage & Spa', 'Transporation':'Transportation', 'Phamarcy':'Pharmacy' };
function placeholderPhoto(cat) {
    const label = String(PH_LABELS[cat] || cat || 'Location').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const fs = label.length > 22 ? 40 : (label.length > 14 ? 52 : 64);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">'
        + '<rect width="800" height="600" fill="#ffffff"/><rect x="1" y="1" width="798" height="598" fill="none" stroke="#e2e8f0" stroke-width="2"/>'
        + '<text x="400" y="300" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="' + fs + '" font-weight="700" fill="#334155">' + label + '</text></svg>';
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);

// ===== DAILY ROTATION (Home location card & Stories change every day, and never repeat each other) =====
// Same calendar day (device-local date) => everyone sees the same picks; the set changes again after midnight.
function dailyRotationSeed(salt) {
    const now = new Date();
    let seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
    const str = String(salt || '');
    for (let i = 0; i < str.length; i++) seed = (seed * 31 + str.charCodeAt(i)) >>> 0;
    return seed >>> 0;
}
// Deterministic shuffle (mulberry32) — same seed always produces the same order.
function seededShuffle(list, seed) {
    const out = list.slice();
    let s = seed >>> 0;
    for (let i = out.length - 1; i > 0; i--) {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        const j = Math.floor(r * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
}

    const members = HOME_GROUP_MEMBERS[category];
    const pool = LOCATIONS.filter(l => members ? members.includes(l.category) : l.category === category);
    // Spread today's picks across different provinces (round-robin) instead of clustering in one area.
    const byProvince = {};
    seededShuffle(pool, dailyRotationSeed('home_card_' + category)).forEach(l => {
        const key = l.province || 'Other';
        (byProvince[key] = byProvince[key] || []).push(l);
    });
    const provinces = seededShuffle(Object.keys(byProvince).sort(), dailyRotationSeed('home_prov_' + category));
    const picks = [];
    for (let round = 0; picks.length < 10; round++) {
        let added = false;
        for (const prov of provinces) {
            if (picks.length >= 10) break;
            if (byProvince[prov][round]) { picks.push(byProvince[prov][round]); added = true; }
        }
        if (!added) break;
    }
    return picks;
}

function getDailyStories() {
    const storiesCount = 8;
    const eligible = LOCATIONS.filter(l => l.photos && l.photos.length > 0 && l.category !== 'Hotel');
    // Exclude whatever the Home location card is showing today, so Stories never duplicates it.
    const homeCardToday = new Set(getDailyIconSliderLocations(iconFilter).map(l => l.name));
    const pool = eligible.filter(l => !homeCardToday.has(l.name));
    const chosen = seededShuffle(pool.length ? pool : eligible, dailyRotationSeed('stories')).slice(0, storiesCount);
    return chosen.map((loc, i) => ({
        id: 'loc_' + i,
        author: loc.category,
        avatar: categoryEmoji(loc.category),
        title: loc.name,
        thumbnail: loc.photos[0],
        videoUrl: '',
        isVideo: false,
        likes: Math.floor((loc.name.length * 137 + i * 23) % 8000) + 500,
        views: Math.floor((loc.name.length * 293 + i * 47) % 25000) + 2000,
        location: loc.province || 'Cambodia',
        locationName: loc.name
    }));
}

// ===== VIEW COUNT SYSTEM — localStorage only (YouTube-style: once per device) =====
// Views are stored locally per device. No database needed.
// Each location/story is counted once per device using a "seen" flag in localStorage.

let viewCache = {};

// Convert any name to a safe localStorage key
function toKey(name) {
    return name.replace(/[.#$\[\]/]/g, '_').replace(/\s+/g, '_').substring(0, 80);
}

// Load all view counts from localStorage at startup
function loadViewCounts() {
    const stored = JSON.parse(localStorage.getItem('vc_cambodia') || '{}');
    viewCache = stored;
    return Promise.resolve(); // returns promise for compatibility with await
}

// Read count synchronously from cache
function getViewCount(name) {
    return viewCache[toKey(name)] || 0;
}
function getLocationViews(name) { return getViewCount(name); }

// Increment: only once per device per location (localStorage guard)
function incrementViewOnce(name) {
    const slug = toKey(name);
    const seenKey = 'sv_' + slug;
    if (localStorage.getItem(seenKey)) {
        return Promise.resolve(viewCache[slug] || 0);
    }
    localStorage.setItem(seenKey, '1');
    const newCount = (viewCache[slug] || 0) + 1;
    viewCache[slug] = newCount;
    localStorage.setItem('vc_cambodia', JSON.stringify(viewCache));
    return Promise.resolve(newCount);
}

// Story view tracking (same pattern)
function incrementStoryViewOnce(storyId) {
    const slug = toKey('story_' + storyId);
    const seenKey = 'sv_' + slug;
    const current = viewCache[slug] || 0;
    if (localStorage.getItem(seenKey)) return Promise.resolve(current);
    localStorage.setItem(seenKey, '1');
    const newCount = current + 1;
    viewCache[slug] = newCount;
    localStorage.setItem('vc_cambodia', JSON.stringify(viewCache));
    return Promise.resolve(newCount);
}
function getStoryViewCount(storyId) {
    return viewCache[toKey('story_' + storyId)] || 0;
}

function googleClientReady() {
    return typeof google !== 'undefined' && google.accounts && google.accounts.oauth2 &&
        GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') !== 0;
}

function startGoogleLogin() {
    if (!googleClientReady()) { alert('Google sign-in is not set up yet. You can still save Favourites on this device without it.'); return; }
    const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'openid email profile',
        callback: (resp) => {
            if (!resp || !resp.access_token) return;
            callBackend('googleLogin', { accessToken: resp.access_token }).then(res => {
                if (res && res.success) {
                    userSession = { token: res.token, email: res.email, name: res.name, picture: res.picture };
                    localStorage.setItem('user_session_cambodia', JSON.stringify(userSession));
                    syncFavouritesFromServer().then(render);
                } else {
                    alert((res && res.message) || 'Could not sign in with Google. Please try again.');
                }
            }).catch(() => alert('Connection error while signing in. Please try again.'));
        }
    });
    client.requestAccessToken();
}

    userSession = null;
    localStorage.removeItem('user_session_cambodia');
    render();
    if (token) callBackend('logoutUser', { token }).catch(() => {});
}

// Merge server-saved favourites (from the visitor’s Google account) with
// whatever is already saved locally on this device, then keep both in sync.
function syncFavouritesFromServer() {
    if (!isUser()) return Promise.resolve();
    return callBackend('getFavorites', { token: userSession.token }).then(res => {
        if (res && res.success && Array.isArray(res.data)) {
            const merged = Array.from(new Set([...favourites, ...res.data]));
            const newlyLocalOnly = favourites.filter(n => !res.data.includes(n));
            favourites = merged;
            saveFavourites();
            // Push anything that was only saved locally up to the account too.
            newlyLocalOnly.forEach(name => callBackend('addFavorite', { token: userSession.token, locationName: name }).catch(()=>{}));
        }
    }).catch(() => {});
}

function fetchBackendGet(action) {
    return fetch(`${APPS_SCRIPT_URL}?action=${action}`).then(r => r.json()).catch(() => ({ success:false }));
}
let EMERGENCY = []; // {ID,Name,Category,Number,Region,Notes} — loaded from the Emergency sheet
async function loadRemoteContent() {
    try {
        const [locRes, evRes, emRes, vidRes, notifRes] = await Promise.all([fetchBackendGet('getLocations'), fetchBackendGet('getEvents'), fetchBackendGet('getEmergency'), fetchBackendGet('getVideos'), fetchBackendGet('getNotifications')]);
        if (notifRes && notifRes.success && Array.isArray(notifRes.data)) {
            NOTIFICATIONS = notifRes.data.filter(r => r.ID && (r.Title || r.Message)).map(r => ({ id: String(r.ID), title: r.Title || '', message: r.Message || '', createdAt: r.CreatedAt || '' })).reverse();
            updateNotifBadge();
        }
        if (vidRes && vidRes.success && Array.isArray(vidRes.data)) {
            VIDEOS = vidRes.data.filter(r => r.Name && ytId(r.YouTubeUrl)).map(r => ({ id: r.ID, name: r.Name, thumbnail: r.Thumbnail || '', category: r.Category || '', province: r.Province || '', url: r.YouTubeUrl, views: Number(r.Views) || 0 })).reverse();
        }
        if (emRes && emRes.success && Array.isArray(emRes.data)) {
            EMERGENCY = emRes.data.filter(row => row.Name && row.Number);
        }
        if (locRes && locRes.success && Array.isArray(locRes.data)) {
            locRes.data.forEach(row => {
                if (!row.Name || LOCATIONS.some(l => l._id === row.ID)) return;
                LOCATIONS.push({
                    name: row.Name, category: row.Category, province: row.Province,
                    latitude: parseFloat(row.Latitude), longitude: parseFloat(row.Longitude),
                    price: row.Price || '', openHours: row.OpenHours || '',
                    photos: Array.isArray(row.Photos) ? row.Photos.map(resolvePhoto) : [],
                    desc: row.Desc || '', _id: row.ID
                });
            });
        }
        if (evRes && evRes.success && Array.isArray(evRes.data)) {
            evRes.data.forEach(row => {
                if (!row.Title || EVENTS.some(e => e._id === row.ID)) return;
                const dateLabel = (row.DateTo && row.DateTo !== row.DateFrom) ? `${formatDMY(row.DateFrom)} - ${formatDMY(row.DateTo)}` : formatDMY(row.DateFrom);
                EVENTS.push({
                    title: row.Title, date: dateLabel || row.DateFrom || '',
                    dateFrom: row.DateFrom || '', dateTo: row.DateTo || '',
                    photos: Array.isArray(row.Photos) ? row.Photos : [],
                    desc: row.Desc || '', _id: row.ID
                });
            });
        }
    } catch (e) { /* backend unreachable — app still runs fine on the built-in data */ }
}

function adminEdit(kind, id) {
    if (kind === 'location') { const x = LOCATIONS.find(l => l._id === id); if (!x) return; closeModal(); openAddLocationForm(x); }

function adminDelete(kind, id) {
    const label = { location: 'location', event: 'event', video: 'video' }[kind];
    if (!confirm('Delete this ' + label + '? This cannot be undone.')) return;
    const action = { location: 'deleteLocation', event: 'deleteEvent', video: 'deleteVideo' }[kind];
    callBackend(action, { id }).then(res => {
        if (!res || !res.success) { alert((res && res.message) || 'Could not delete. Please try again.'); return; }
        if (kind === 'location') { const i = LOCATIONS.findIndex(l => l._id === id); if (i > -1) LOCATIONS.splice(i, 1); closeModal(); }
        else if (kind === 'event') { const i = EVENTS.findIndex(e => e._id === id); if (i > -1) EVENTS.splice(i, 1); closeModal(); }
        else { const i = VIDEOS.findIndex(v => String(v.id) === String(id)); if (i > -1) VIDEOS.splice(i, 1); }
        render();
    }).catch(() => alert('Connection error. Please try again.'));
}

// ===== DISTANCE =====
function calculateDistance(lat1,lon1,lat2,lon2) {
    const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return (R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(2);
}

// ===== OPEN HOURS ("HH:MM-HH:MM", handles overnight ranges) =====
function openStatus(openHours) {
    if (!openHours || openHours.indexOf('-') === -1) return null;
    const parts = openHours.split('-').map(s => s.trim());
    if (parts.length !== 2) return null;
    const toMinutes = t => { const m = t.match(/(\d{1,2}):(\d{2})/); return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : null; };
    const openMin = toMinutes(parts[0]), closeMin = toMinutes(parts[1]);
    if (openMin === null || closeMin === null) return null;
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const isOpen = closeMin > openMin ? (nowMin >= openMin && nowMin < closeMin) : (nowMin >= openMin || nowMin < closeMin);
    if (!isOpen) return { open:false, label:'Closed', closeIn:null };
    const minsToClose = closeMin > nowMin ? (closeMin - nowMin) : (closeMin + 1440 - nowMin);
    if (minsToClose <= 30) return { open:true, label:'Closing soon', closeIn:minsToClose };
    return { open:true, label:'Open Now', closeIn:minsToClose };
}
function renderOpenBadge(openHours) {
    const st = openStatus(openHours);
    if (!st) return '';
    if (!st.open) return `<span class="text-[9px] font-black text-slate-400 bg-slate-100 px-2 py-1 rounded-lg"><i class="fa-solid fa-clock mr-1"></i>Closed</span>`;
    if (st.label === 'Closing soon') return `<span class="text-[9px] font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-lg"><i class="fa-solid fa-clock mr-1"></i>Closing in ${st.closeIn}m</span>`;
    return `<span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg"><i class="fa-solid fa-circle-check mr-1"></i>Open Now</span>`;
}
function formatDMY(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    if (parts.length !== 3) return iso;
    const [y,m,d] = parts;
    return `${d}-${m}-${y}`;
}

function renderNearbyList() {
    let data = LOCATIONS.map(l=>({...l,distance:parseFloat(calculateDistance(userPos.lat,userPos.lng,l.latitude,l.longitude))}));
    if (homeFilter!=='All') data=data.filter(l=>l.category===homeFilter);
    if (homeDistance==='lt1') data=data.filter(l=>l.distance<1);
    else if (homeDistance==='1-5') data=data.filter(l=>l.distance>=1 && l.distance<=5);
    else if (homeDistance==='5-10') data=data.filter(l=>l.distance>5 && l.distance<=10);
    else if (homeDistance==='10-50') data=data.filter(l=>l.distance>10 && l.distance<=50);
    else if (homeDistance==='50-100') data=data.filter(l=>l.distance>50 && l.distance<=100);
    else if (homeDistance==='100plus') data=data.filter(l=>l.distance>100);

    if (homeSort==='rating') data.sort((a,b)=> avgRating(b.name)-avgRating(a.name) || a.distance-b.distance);
    else if (homeSort==='popular') data.sort((a,b)=> getLocationViews(b.name)-getLocationViews(a.name) || a.distance-b.distance);
    else if (homeSort==='open') data.sort((a,b)=>{ const sa=openStatus(a.openHours), sb=openStatus(b.openHours); const oa=(sa&&sa.open)?0:1, ob=(sb&&sb.open)?0:1; return oa-ob || a.distance-b.distance; });
    else data.sort((a,b)=>a.distance-b.distance);

    const items=data.slice(0,12);
    if (items.length===0) return '<p class="text-center text-xs text-slate-300 py-10">No items found.</p>';
    return items.map(l=>`
        <div class="flex items-center gap-4 p-4 bg-white rounded-[25px] shadow-md border-2 border-slate-300 active:bg-slate-50 transition-colors">

                <p class="text-[10px] text-slate-400 mb-2 font-medium">${l.category}</p>
                <div class="flex items-center justify-center gap-2 flex-wrap">
                    ${renderRatingBadge(l.name)}

let VIDEOS = []; // {id,name,thumbnail,category,province,url,views}
let trendSearch = '', trendCat = 'All', trendProv = 'All';

function ytId(url) {
    const m = String(url || '').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
}
function videoThumb(v) { return v.thumbnail || ('https://img.youtube.com/vi/' + ytId(v.url) + '/hqdefault.jpg'); }
function escHtml(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function filteredVideos() {
    const q = trendSearch.trim().toLowerCase();
    return VIDEOS.filter(v =>
        (!q || v.name.toLowerCase().includes(q)) &&
        (trendCat === 'All' || v.category === trendCat) &&
        (trendProv === 'All' || v.province === trendProv));
}
// A video is a "Short" (9:16) when it was added with a YouTube Shorts link (youtube.com/shorts/...)
function isShortVideo(v) { return /youtube\.com\/shorts\//i.test(String(v.url || '')); }
function videoAdminBtns(v) {
    return canEditContent() ? `<div class="absolute top-2 right-2 flex gap-1.5 z-10" onclick="event.stopPropagation()">

                </div>` : '';
}
function renderTrendingGrid() {

// 10 videos per page, with Prev / Next (same style as Explore)
const TREND_PER_PAGE = 10;
let trendPage = { grid: 1, shorts: 1 };
function trendSlice(all, key) {
    const total = Math.max(1, Math.ceil(all.length / TREND_PER_PAGE));
    if (trendPage[key] > total) trendPage[key] = total;
    if (trendPage[key] < 1) trendPage[key] = 1;
    const start = (trendPage[key] - 1) * TREND_PER_PAGE;
    return all.slice(start, start + TREND_PER_PAGE);
}
function trendPagHtml(all, key) {
    const total = Math.ceil(all.length / TREND_PER_PAGE);
    if (total <= 1) return '';
    const p = trendPage[key];
    return `<button onclick="changeTrendPage('${key}',${p - 1})" ${p === 1 ? 'disabled' : ''} class="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center disabled:opacity-30"><i class="fa-solid fa-chevron-left"></i></button><span class="flex items-center font-black text-xs text-slate-400">${p} / ${total}</span><button onclick="changeTrendPage('${key}',${p + 1})" ${p === total ? 'disabled' : ''} class="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center disabled:opacity-30"><i class="fa-solid fa-chevron-right"></i></button>`;
}
function changeTrendPage(key, p) {
    trendPage[key] = p;
    refreshTrending();
    const sec = document.getElementById(key === 'shorts' ? 'trend-sec-shorts' : 'trend-sec-grid');
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); else window.scrollTo(0, 0);
}
function refreshTrending() {
    const g = document.getElementById('trend-grid'); if (g) g.innerHTML = renderTrendingGrid();
    const sh = document.getElementById('trend-shorts'); if (sh) sh.innerHTML = renderTrendingShorts();
    const pg = document.getElementById('trend-pag-grid'); if (pg) pg.innerHTML = trendPagHtml(filteredVideos().filter(v => !isShortVideo(v)), 'grid');
    const ps = document.getElementById('trend-pag-shorts'); if (ps) ps.innerHTML = trendPagHtml(filteredVideos().filter(isShortVideo), 'shorts');
}

function setTrendView(v) {

let ytApiPromise = null, ytPlayer = null, ytTimer = null;
function loadYouTubeApi() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (!ytApiPromise) {
        ytApiPromise = new Promise((resolve, reject) => {
            const prev = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) {} resolve(); };
            const sc = document.createElement('script');
            sc.src = 'https://www.youtube.com/iframe_api';
            sc.onerror = () => { ytApiPromise = null; reject(new Error('api')); };
            document.head.appendChild(sc);
        });
    }
    return ytApiPromise;
}
function destroyYtPlayer() {
    if (ytTimer) { clearTimeout(ytTimer); ytTimer = null; }
    if (ytPlayer && ytPlayer.destroy) { try { ytPlayer.destroy(); } catch (e) {} }
    ytPlayer = null;
}
function showVideoFallback(yid, reason) {
    const wrap = document.getElementById('yt-wrap');
    if (!wrap) return;
    destroyYtPlayer();
    wrap.innerHTML = `
        <img src="https://img.youtube.com/vi/${yid}/hqdefault.jpg" class="absolute inset-0 w-full h-full object-cover opacity-40" onerror="this.style.display='none'">
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 gap-3">
            <p class="text-white text-[12px] font-semibold">This video can’t be played inside the app${reason ? ' (' + escHtml(reason) + ')' : ''}.</p>
            <a href="https://www.youtube.com/watch?v=${yid}" target="_blank" rel="noopener" class="px-5 py-3 rounded-2xl bg-red-600 text-white text-[12px] font-black"><i class="fa-brands fa-youtube mr-2"></i>Watch on YouTube</a>
        </div>`;
}
function openVideo(id) {
    const v = VIDEOS.find(x => String(x.id) === String(id));
    if (!v) return;
    const yid = ytId(v.url);
    destroyYtPlayer();
    document.getElementById('video-modal-body').innerHTML = `
        <div class="flex items-center justify-between mb-3 gap-3">
            <h3 class="text-white font-black text-sm leading-snug">${escHtml(v.name)}</h3>
            <button onclick="closeVideoModal()" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-xmark text-white"></i></button>
        </div>
        <div id="yt-wrap" class="relative w-full rounded-2xl overflow-hidden bg-black" style="${isShortVideo(v) ? 'aspect-ratio:9/16;width:min(100%,calc(78vh*9/16));margin:0 auto' : 'aspect-ratio:16/9'}">
            <div id="yt-player" class="absolute inset-0"></div>
        </div>
        <div class="flex items-center justify-between gap-3 mt-3">
            <p class="text-white/60 text-[11px] font-semibold truncate">${escHtml(v.province)}${v.province && v.category ? ' • ' : ''}${escHtml(v.category)}</p>
            <a href="https://www.youtube.com/watch?v=${yid}" target="_blank" rel="noopener" class="text-[11px] font-black text-white bg-white/15 px-3 py-2 rounded-xl flex-shrink-0"><i class="fa-brands fa-youtube mr-1"></i>Watch on YouTube</a>
        </div>
    `;
    document.getElementById('video-modal').classList.remove('hidden');
    pushModalHistory();
    // Player: if YouTube refuses to play inside the app (blocked, embedding disabled, offline...) show a clear fallback instead of a black box
    ytTimer = setTimeout(() => showVideoFallback(yid, 'no response'), 8000);
    loadYouTubeApi().then(() => {
        if (!document.getElementById('yt-player')) return;
        ytPlayer = new YT.Player('yt-player', {
            videoId: yid, width: '100%', height: '100%',
            playerVars: { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 },
            events: {
                onReady: e => { if (ytTimer) { clearTimeout(ytTimer); ytTimer = null; } try { e.target.playVideo(); } catch (x) {} },
                onError: e => showVideoFallback(yid, 'error ' + (e && e.data))
            }
        });
    }).catch(() => showVideoFallback(yid, 'player blocked'));
    // Count one view per device per video
    let seen = false;
    try { seen = !!localStorage.getItem('sv_video_' + v.id); if (!seen) localStorage.setItem('sv_video_' + v.id, '1'); } catch (e) {}
    if (!seen) {
        v.views = (v.views || 0) + 1;
        refreshTrending();
        callBackend('viewVideo', { id: v.id }).catch(() => {});
    }
}

    const name = document.getElementById('vid-name').value.trim();
    const category = document.getElementById('vid-category').value;
    const province = document.getElementById('vid-province').value;
    const url = document.getElementById('vid-url').value.trim();

    btn.disabled = true;
    btn.innerHTML = '<div class="loader-spinner" style="border-color:rgba(255,255,255,0.35);border-top-color:#fff"></div>';
    const editId = editingVidId;
    callBackend(editId ? 'updateVideo' : 'addVideo', { id: editId, name, category, province, url, thumbnail })
        .then(res => {

                if (editId) { const t = VIDEOS.find(v => String(v.id) === String(editId)); if (t) Object.assign(t, { name, thumbnail, category, province, url }); }
                else VIDEOS.unshift({ id: res.id, name, thumbnail, category, province, url, views: 0 });
                closeAdminContentModal();
                render();
            } else {
                err.textContent = (res && res.message) || 'Failed to save. Please try again.';
                err.classList.remove('hidden');
                btn.disabled = false; btn.innerHTML = 'Save Video';
            }
        })

            err.textContent = 'Connection error. Please try again.';
            err.classList.remove('hidden');
            btn.disabled = false; btn.innerHTML = 'Save Video';
        });
}

function stopStory() {
    if (storyProgressInterval) { clearInterval(storyProgressInterval); storyProgressInterval=null; }
}

function renderStory(container) {
    container.style.padding = '0';
    container.style.paddingBottom = '0';
    document.getElementById('app').style.paddingBottom = '0';
    // Show instant skeleton while async view-count fetches
    container.innerHTML = `<div class="story-container" style="height:calc(100vh - 75px);background:#000;display:flex;align-items:center;justify-content:center"><div class="loader-spinner" style="border-top-color:#fff"></div></div>`;
    renderStoryAsync(container);
}

async function renderStoryAsync(container) {
    const dailyStories = getDailyStories();
    const allStories = [...dailyStories, ...userStories];
    if (allStories.length === 0) {
        container.innerHTML = `<div class="flex items-center justify-center h-screen text-slate-400"><p>No stories yet.</p></div>`;
        return;
    }
    if (storyIndex >= allStories.length) storyIndex = 0;
    const story = allStories[storyIndex];

    // Count view — once per device, synced via Firebase
    const realViews = await incrementStoryViewOnce(story.id);

    container.innerHTML = `
        <div class="story-container" id="story-container" style="height:calc(100vh - 75px)">
            <div class="story-progress-bar" id="story-progress-bar">
                ${allStories.map((_,i)=>`<div class="story-progress-seg"><div class="story-progress-fill" id="prog-${i}" style="width:${i<storyIndex?'100%':i===storyIndex?'0%':'0%'}"></div></div>`).join('')}
            </div>
            <div class="story-video-wrap" id="story-media-wrap">
                ${story.videoUrl
                    ? `<video id="story-video" src="${story.videoUrl}" autoplay muted loop playsinline class="w-full h-full object-cover"></video>`
                    : `<img src="${story.thumbnail}" class="w-full h-full object-cover" style="filter:brightness(0.85)">`}
                <div onclick="prevStory()" class="absolute left-0 top-0 w-1/3 h-full z-20" style="cursor:pointer"></div>
                <div onclick="nextStory()" class="absolute right-0 top-0 w-1/3 h-full z-20" style="cursor:pointer"></div>
            </div>
            <div class="story-overlay z-10">
                <div class="flex items-end">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-2xl">${story.avatar}</span>
                            <div>
                                <p class="text-white font-bold text-sm">${story.author}</p>
                                <p class="text-white/60 text-xs"><i class="fa-solid fa-location-dot mr-1"></i>${story.location}</p>
                            </div>
                        </div>
                        <p class="text-white font-black text-lg leading-tight mb-3">${story.title}</p>
                        <div class="flex items-center gap-1.5 text-white/90 text-xs bg-black/30 backdrop-blur px-3 py-1.5 rounded-full w-fit">
                            <i class="fa-solid fa-eye"></i>
                            <span>${formatNum(realViews)} view${realViews !== 1 ? 's' : ''}</span>

                    <i class="fa-solid fa-star mr-1"></i>Featured Stories
                </div>
            </div>
        </div>
    `;
    startStoryProgress(allStories.length);
}

let storiesLiked = {};
function storyLike(idx, btn) {
    storiesLiked[idx] = !storiesLiked[idx];
    const dailyStories = getDailyStories();
    const allStories = [...dailyStories, ...userStories];
    const story = allStories[idx];
    if (storiesLiked[idx]) story.likes++;
    btn.innerHTML = `<i class="fa-${storiesLiked[idx]?'solid':'regular'} fa-heart ${storiesLiked[idx]?'text-rose-400':''}"></i><span>${formatNum(story.likes)}</span>`;
}
function formatNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'K' : n; }
function shareStory() { if(navigator.share) navigator.share({title:'Visit Cambodia Story',url:window.location.href}); }

function startStoryProgress(total) {
    stopStory();
    const DURATION = 5000;
    const STEP = 100;
    storyProgress = 0;
    storyProgressInterval = setInterval(() => {
        storyProgress += (STEP / DURATION) * 100;
        const bar = document.getElementById(`prog-${storyIndex}`);
        if (bar) bar.style.width = Math.min(storyProgress, 100) + '%';
        if (storyProgress >= 100) {
            stopStory();
            const allStories = [...getDailyStories(), ...userStories];
            storyIndex = (storyIndex + 1) % allStories.length;
            renderStory(document.getElementById('main-content'));
        }
    }, STEP);
}

function nextStory() {
    const allStories = [...getDailyStories(), ...userStories];
    stopStory(); storyIndex = (storyIndex+1) % allStories.length;
    renderStory(document.getElementById('main-content'));
}
function prevStory() {
    const allStories = [...getDailyStories(), ...userStories];
    stopStory(); storyIndex = (storyIndex-1+allStories.length) % allStories.length;
    renderStory(document.getElementById('main-content'));
}

// ----- My Travel Notes (saved on this device) -----
let travelNotes = JSON.parse(localStorage.getItem('travel_notes_cambodia') || '[]'); // {id,text,time}
function saveTravelNotes() { localStorage.setItem('travel_notes_cambodia', JSON.stringify(travelNotes)); }
let editingNoteId = null;
function addTravelNote() {
    const el = document.getElementById('travel-note-input');
    const tl = document.getElementById('travel-note-title');
    if (!el) return;
    const text = el.value.trim();
    const title = tl ? tl.value.trim().substring(0, 80) : '';
    if (!text && !title) return;
    if (editingNoteId) {
        const n = travelNotes.find(x => x.id === editingNoteId);
        if (n) { n.title = title; n.text = text.substring(0, 1000); n.edited = new Date().toISOString(); }
        editingNoteId = null;
        saveTravelNotes();
        render();
        return;
    }
    travelNotes.unshift({ id: 'n' + Date.now(), title, text: text.substring(0, 1000), time: new Date().toISOString() });
    saveTravelNotes();
    el.value = ''; if (tl) tl.value = '';
    renderTravelNotesList();
}
function editTravelNote(id) {
    editingNoteId = id;
    render();
    const box = document.getElementById('travel-note-title');
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function cancelEditTravelNote() { editingNoteId = null; render(); }
function deleteTravelNote(id) {
    if (!confirm('Delete this note?')) return;
    travelNotes = travelNotes.filter(n => n.id !== id);
    if (editingNoteId === id) editingNoteId = null;
    saveTravelNotes();
    render();
}
function renderTravelNotesList() {
    const box = document.getElementById('travel-notes-list');
    if (!box) return;
    box.innerHTML = travelNotes.length === 0 ? '<p class="text-center text-xs text-slate-300 py-3">No notes yet.</p>' : travelNotes.map(n => `
        <div class="p-3.5 bg-amber-50/60 rounded-2xl border border-amber-100">
            <div class="flex items-start justify-between gap-3">
                <div class="flex-1 min-w-0">
                    ${n.title ? `<h4 class="text-[14px] font-black text-slate-800 leading-snug mb-1" style="word-break:break-word">${escHtml(n.title)}</h4>` : ''}
                    <p class="text-[13px] text-slate-700 font-semibold leading-relaxed" style="white-space:pre-line;word-break:break-word">${escHtml(n.text)}</p>
                </div>
                <div class="flex gap-1.5 flex-shrink-0">
                    <button onclick="editTravelNote('${n.id}')" class="w-7 h-7 rounded-full bg-white text-sky-700 flex items-center justify-center"><i class="fa-solid fa-pen text-[10px]"></i></button>
                    <button onclick="deleteTravelNote('${n.id}')" class="w-7 h-7 rounded-full bg-white text-rose-500 flex items-center justify-center"><i class="fa-solid fa-trash text-[10px]"></i></button>
                </div>
            </div>
            <p class="text-[10px] font-bold text-slate-300 mt-1.5">${notifDateLabel(n.time)}</p>
        </div>`).join('');
}

const EM_TYPES = [
    { key:'police',    label:'Police',          km:'ប៉ូលិស',                         i:'fa-shield-halved' },
    { key:'ambulance', label:'Ambulance',       km:'រថយន្តសង្គ្រោះ',                  i:'fa-truck-medical' },
    { key:'tourist',   label:'Tourism Police',  km:'ប៉ូលិសទេសចរណ៍',                  i:'fa-user-shield' },
    { key:'fire',      label:'Fire & Rescue',   km:'ពន្លត់អគ្គិភ័យ និងជួយសង្គ្រោះ',     i:'fa-fire-extinguisher' },
    { key:'motorbike', label:'Motorbike Help',  km:'ជំនួយម៉ូតូ',                      i:'fa-motorcycle' },
    { key:'car',       label:'Car Assistance',  km:'ជំនួយរថយន្ត',                     i:'fa-car-burst' },
    { key:'hospital',  label:'Nearby Hospital', km:'មន្ទីរពេទ្យនៅជិត',                 i:'fa-hospital' }
];
function emTypeOf(e) {
    const t = (String(e.Category || '') + ' ' + String(e.Name || '')).toLowerCase();
    if (/tourism|tourist/.test(t)) return 'tourist';
    if (/motor|moto/.test(t)) return 'motorbike';
    if (/\bcar\b|vehicle|towing|\btow\b/.test(t)) return 'car';
    if (/ambulance/.test(t)) return 'ambulance';
    if (/fire|rescue/.test(t)) return 'fire';
    if (/hospital|clinic|medical|red cross/.test(t)) return 'hospital';
    if (/police/.test(t)) return 'police';
    return '';
}
function emCoords(e) {
    const la = parseFloat(e.Latitude), ln = parseFloat(e.Longitude);
    return (isFinite(la) && isFinite(ln)) ? { lat: la, lng: ln } : null;
}
let emLoading = false;
function emShareLocation() {
    if (emLoading) return;
    if (!navigator.geolocation) { alert('Location access denied.'); return; }
    emLoading = true; renderEmergencyModal();
    navigator.geolocation.getCurrentPosition(pos => {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        emLoading = false; renderEmergencyModal();
    }, () => { alert('Location access denied.'); emLoading = false; renderEmergencyModal(); }, { enableHighAccuracy: true });
}
function emergencyItems() {
    const list = EMERGENCY.length ? EMERGENCY : EMERGENCY_FALLBACK;
    const out = [];
    EM_TYPES.forEach(t => {
        const entries = list.filter(e => emTypeOf(e) === t.key && String(e.Number || '').trim());
        if (!entries.length) return;
        let pick = null, dist = null;
        if (userPos) {
            entries.forEach(e => {
                const c = emCoords(e);
                if (!c) return;
                const d = parseFloat(calculateDistance(userPos.lat, userPos.lng, c.lat, c.lng));
                if (dist === null || d < dist) { dist = d; pick = e; }
            });
        }
        if (!pick) pick = entries.find(e => !String(e.Region || '').trim() || String(e.Region).trim() === 'All') || entries[0];
        out.push({ type: t, e: pick, dist });
    });
    if (userPos) out.sort((a, b) => (a.dist === null) - (b.dist === null) || (a.dist || 0) - (b.dist || 0));
    return out;
}

function escapeHtml(s) {

function formatAIReply(text) {

function buildAIContext() {
    // Compact summary of the app’s real data — Essentials tab plus every relevant Sheet — so the AI
    // grounds answers in actual platform content before it falls back on general knowledge.
    const essentialsSummary = buildEssentialsSummary();
    const locSummary = LOCATIONS.slice(0, 120).map(l =>

    ).join('\n');

function sendAIMessage(preset) {
    const input = document.getElementById('ai-input');
    const text = (preset !== undefined ? preset : (input ? input.value.trim() : ''));
    if (!text || aiSending) return;

    // Guests (no admin or Google account signed in) get a limited number of AI Guide questions per day.
    const isGuestAI = !adminSession && !userSession;
    if (isGuestAI && getAIGuideGuestUsage().count >= AI_GUIDE_GUEST_DAILY_LIMIT) {
        aiMessages.push({ role:'user', text });
        if (input) input.value = '';
        aiMessages.push({ role:'assistant', text:
            "You've used today's " + AI_GUIDE_GUEST_DAILY_LIMIT + " free AI Guide questions as a guest. " +
            "Please come back tomorrow, or contact the developer to keep using it today: 097 999 6788 · aunvannda01@gmail.com"
        });
        saveAIMessages();
        renderAIChatLog();
        return;
    }

    aiMessages.push({ role:'user', text });
    if (input) input.value = '';
    saveAIMessages();
    renderAIChatLog();
    aiSending = true;
    const typing = document.getElementById('ai-typing');
    if (typing) typing.classList.remove('hidden');
    if (typing) typing.style.display = 'flex';

    if (isGuestAI) bumpAIGuideGuestUsage();

    const history = aiMessages.slice(0, -1).map(m => ({ role: m.role, text: m.text }));

    callBackend('aiChat', { message: text, history, context, lang: uiLang })
        .then(res => {
            aiSending = false;
            if (typing) { typing.classList.add('hidden'); typing.style.display = 'none'; }
            if (res && res.success) {
                aiMessages.push({ role:'assistant', text: res.reply });
            } else {
                aiMessages.push({ role:'assistant', text: (res && res.message) || "Sorry, I couldn’t reach the AI service. Please try again." });

            renderAIChatLog();
        })
        .catch(() => {

            aiMessages.push({ role:'assistant', text: "Sorry, I couldn’t reach the AI service. Please try again." });
            saveAIMessages();
            renderAIChatLog();
        });
}

    { label: '2 Days in Phnom Penh', destination: 'Phnom Penh', days: 2, interests: ['Culture', 'Food'] },

function tripProvinceOptions() {

function toggleTripInterest(id) {
    const i = tripForm.interests.indexOf(id);
    if (i === -1) {
        // Random replaces every other choice, and choosing anything else turns Random off
        if (id === 'Random') tripForm.interests = ['Random'];

    } else tripForm.interests.splice(i, 1);

function setTripField(field, val) { tripForm[field] = (field === 'days') ? parseInt(val) : val; }

function useTripExample(idx) {
    const ex = TRIP_EXAMPLES[idx];
    tripForm = { destination: ex.destination, days: ex.days, interests: [...ex.interests], budget: tripForm.budget };
    generateTrip();
}
function generateTrip() {
    const cats = tripForm.interests.length ? TRIP_INTERESTS.filter(t => tripForm.interests.includes(t.id)).flatMap(t => t.cats) : [];
    let pool = LOCATIONS.filter(l => l.province === tripForm.destination);
    if (pool.length === 0) pool = LOCATIONS.slice();
    const foodCats = TRIP_INTERESTS.find(t => t.id === 'Food').cats;
    const isRandom = tripForm.interests.includes('Random');
    if (isRandom) pool = pool.filter(l => RANDOM_CATS.includes(l.category));
    const rank = l => (cats.includes(l.category) ? 1 : 0) * 100 + avgRating(l.name) * 10 + Math.min(getLocationViews(l.name), 50);
    const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const order = arr => isRandom ? shuffle(arr) : arr.sort((a, b) => rank(b) - rank(a));
    const sightPool = order(pool.filter(l => !foodCats.includes(l.category)));
    const foodPool = order(pool.filter(l => foodCats.includes(l.category)));
    const days = Math.max(1, Math.min(14, tripForm.days || 1));
    const usedSights = new Set(), usedFood = new Set();
    const dayList = [];
    for (let d = 0; d < days; d++) {
        const stops = [];
        let time = 8 * 60;
        for (let s = 0; s < 2; s++) {
            const pick = sightPool.find(l => !usedSights.has(l.name)) || sightPool[(d * 2 + s) % Math.max(sightPool.length, 1)];
            if (pick) { usedSights.add(pick.name); stops.push({ loc: pick, time, kind: 'sight' }); time += 120; }
        }
        const lunch = foodPool.find(l => !usedFood.has(l.name)) || foodPool[d % Math.max(foodPool.length, 1)];
        if (lunch) { usedFood.add(lunch.name); stops.push({ loc: lunch, time: 12 * 60, kind: 'food' }); }
        stops.sort((a, b) => a.time - b.time);
        let cursorTime = 8 * 60;
        stops.forEach((st, idx) => {
            if (idx === 0) { st.time = 8 * 60; cursorTime = 8 * 60 + (st.kind === 'food' ? 60 : 120); }
            else { st.time = Math.max(st.time, cursorTime); cursorTime = st.time + (st.kind === 'food' ? 60 : 120); }
        });
        const afternoon = sightPool.find(l => !usedSights.has(l.name));
        if (afternoon && stops.length < 4) { usedSights.add(afternoon.name); stops.push({ loc: afternoon, time: cursorTime, kind: 'sight' }); }
        dayList.push({ stops });
    }
    tripPlanResult = { destination: tripForm.destination, days, interests: [...tripForm.interests] };
    tripPlanResult.dayList = dayList;
    tripActiveDay = 0;
    renderPlanTrip();
}
function fmtTime(mins) {
    let h = Math.floor(mins / 60) % 24, m = mins % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function tripDayDuration(st) { return st.kind === 'food' ? '1 hour' : '2 hours'; }
function tripDistanceBetween(a, b) {
    if (!a || !b) return '';
    return calculateDistance(a.latitude, a.longitude, b.latitude, b.longitude) + ' km';
}
function saveTripPlan() {
    if (!tripPlanResult) return;
    const all = tripPlanResult.dayList.flatMap(d => d.stops.map(s => s.loc.name));
    all.forEach(name => {
        if (!isFav(name)) favourites.push(name);
        if (!tripPlaces.includes(name)) tripPlaces.push(name);
    });
    localStorage.setItem('fav_cambodia', JSON.stringify(favourites));
    localStorage.setItem('trip_places_cambodia', JSON.stringify(tripPlaces));
    const btn = document.getElementById('trip-save-btn');
    if (btn) { btn.innerHTML = '<i class="fa-solid fa-check"></i> Saved to My Trip'; btn.disabled = true; }
    showTripSavedToast(all.length);
}

// Confirmation shown after a trip is saved, with a shortcut into the Favourites tab.
function showTripSavedToast(count) {
    const existing = document.getElementById('trip-saved-toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = 'trip-saved-toast';
    toast.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-[3000] bg-slate-900 text-white text-[12px] font-bold px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3';
    toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Trip saved — ${count} place${count!==1?'s':''} added to Favourites
        <button onclick="closePlanTrip();switchTab('favourite');document.getElementById('trip-saved-toast')?.remove()" class="text-sky-300 underline ml-1">View</button>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

// Rough visit length by category — used for the "Suggested time" row.
function suggestedTime(loc) {
    const cat = (loc.category || '').toLowerCase();
    if (cat.includes('food') || cat.includes('drink') || cat.includes('restaurant') || cat.includes('bar')) return '1 - 1.5 hours';
    if (cat.includes('hotel') || cat.includes('resort')) return 'Overnight stay';
    if (cat.includes('market') || cat.includes('mart') || cat.includes('shopping') || cat.includes('souvenir')) return '1 hour';
    if (cat.includes('temple') || cat.includes('museum') || cat.includes('things to do')) return '2 - 3 hours';
    return '1 - 2 hours';
}
function nearbyLocations(loc, limit) {
    return LOCATIONS.filter(l => l.name !== loc.name)
        .map(l => ({ ...l, distance: parseFloat(calculateDistance(loc.latitude, loc.longitude, l.latitude, l.longitude)) }))
        .sort((a,b) => a.distance - b.distance)
        .slice(0, limit || 6);
}
function shareLocation(name) {
    const loc = LOCATIONS.find(x => x.name === name);
    const url = `https://www.google.com/maps?q=${loc.latitude},${loc.longitude}`;
    if (navigator.share) navigator.share({ title: name, text: `Check out ${name} in Cambodia`, url }).catch(()=>{});
    else { navigator.clipboard && navigator.clipboard.writeText(url); alert('Link copied to clipboard.'); }
}

function toggleDrop(id) {
    const el=document.getElementById('drop-'+id); const arr=document.getElementById('arrow-'+id);
    const visible=el.style.display==='block'; el.style.display=visible?'none':'block';
    if(arr) arr.style.transform=visible?'rotate(0deg)':'rotate(180deg)';
}
function convertCur(type) {
    const u=document.getElementById('usd'), k=document.getElementById('khr');
    if(!u||!k)return;
    if(type==='u') k.value=u.value?Math.round(u.value*4100):'';
    else u.value=k.value?(k.value/4100).toFixed(2):'';
}

// ===== NOTIFICATIONS (Admin posts from the bell in the header; every visitor, signed in or not, sees them) =====
// The badge counts notifications this device has not opened yet, and stays until the bell is opened.
let NOTIFICATIONS = []; // {id,title,message,createdAt} newest first
function getSeenNotifs() { try { return JSON.parse(localStorage.getItem('notif_seen_cambodia') || '[]'); } catch (e) { return []; } }
function unseenNotifCount() { const seen = new Set(getSeenNotifs()); return NOTIFICATIONS.filter(n => !seen.has(n.id)).length; }
function updateNotifBadge() {
    const el = document.getElementById('notif-badge');
    if (!el) return;
    const c = unseenNotifCount() + (canEditContent() ? ACCOUNT_REQUESTS.length : 0);
    el.textContent = c > 99 ? '99+' : String(c);
    el.classList.toggle('hidden', c === 0);
}
function markNotifsSeen() {
    try { localStorage.setItem('notif_seen_cambodia', JSON.stringify(NOTIFICATIONS.map(n => n.id))); } catch (e) {}
    updateNotifBadge();
}
function notifDateLabel(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function submitAccountRequest() {
    const email = document.getElementById('req-email').value.trim();
    const username = document.getElementById('req-username').value.trim();
    const password = document.getElementById('req-password').value;
    const err = document.getElementById('req-error'), btn = document.getElementById('req-btn');

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Please enter a valid email.');
    if (username.length < 3) return fail('User Account must be at least 3 characters.');
    if (password.length < 6) return fail('Password must be at least 6 characters.');

    btn.disabled = true;
    btn.innerHTML = '<div class="loader-spinner" style="border-color:rgba(255,255,255,0.35);border-top-color:#fff"></div>';

// ===== VISITOR COUNTER (daily visits + country, stored in the "Visitors" sheet) =====
// Counts one visit per browser session. Country comes from a free IP-geolocation lookup
// in the visitor's browser; the IP address itself is never sent to or stored by the backend.
function lookupVisitorCountry() {
    const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
    return Promise.race([fetch('https://get.geojs.io/v1/ip/country.json').then(r => r.json()), timeout(4000)])
        .then(j => ({ country: j.name || j.country || 'Unknown', code: j.country || '' }))
        .catch(() => ({ country: 'Unknown', code: '' }));
}
function trackVisit() {
    try {
        if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return;
        if (sessionStorage.getItem('vc_visit_tracked')) return;
        sessionStorage.setItem('vc_visit_tracked', '1');
    } catch (e) {}
    let lastDay = '';
    try { lastDay = localStorage.getItem('vc_last_visit_day') || ''; } catch (e) {}
    lookupVisitorCountry().then(c => callBackend('trackVisit', { country: c.country, countryCode: c.code, lastDay }))
        .then(res => { if (res && res.success && res.day) { try { localStorage.setItem('vc_last_visit_day', res.day); } catch (e) {} } })
        .catch(() => {});
}

window.onload = function() {
    trackVisit();
    // Render immediately with local data so the screen is never left blank,
    // then layer in server-backed data (views, remote content, ratings, favourites)
    // as each independently-guarded fetch resolves.
    try { loadViewCounts(); render(); } catch (e) { console.error('Initial render failed:', e); }
    loadRemoteContent().then(() => { render(); }).catch(() => {});
    loadAccountRequests();
    loadRatings().then(() => { if (currentTab !== 'trending') render(); }).catch(() => {});
    if (isUser()) syncFavouritesFromServer().then(() => { if (currentTab === 'favourite') render(); }).catch(() => {});
};
